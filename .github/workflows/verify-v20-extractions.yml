name: Verify V20 extraction integrity
on:
  push:
    branches: [development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:
jobs:
  source-integrity:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare extracted modules with canonical V20 source
        run: node scripts/check-extractions.mjs
