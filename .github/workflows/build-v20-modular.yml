name: Build V20 modular application
on:
  push:
    branches: [development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run verify
      - run: npm run build
