        @keyframes fxFade { 
            from { opacity: 0; transform: translateY(5px); } 
            to { opacity: 1; transform: none; } 
        }

        .fx-pop { animation: fxFade .16s ease-out both; }

        body { background-color: #090A0D; color: #e2e8f0; font-family: Inter, sans-serif; }

        /* Orantılı Çalışma Alanları ve Izgara Sistemleri */
        .v219-workspace { min-width:0; width:100%; }
        .v2110-main-grid {display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);gap:12px;align-items:stretch;}
        .v2110-main-grid > * {min-width:0;}
        .v2110-reference {height:clamp(240px,26vw,390px);min-height:0;display:flex;flex-direction:column;overflow:hidden;}
        .v2110-reference .v219-hero {height:clamp(175px,21vw,300px)!important;max-height:300px;}
        .v2110-controls {max-height:clamp(350px,40vw,600px);overflow-y:auto;scrollbar-width:thin;}
        .v2110-studio-grid {display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.2fr);gap:12px;align-items:stretch;}
        .v2110-studio-grid > * {min-width:0;height:clamp(520px,52vw,720px);display:flex;flex-direction:column;overflow:hidden;}
        .v2110-studio-grid > .v2110-middle {display:flex;flex-direction:column;gap:12px;height:100%;}
        .v2110-studio-grid > .v2110-middle > * {min-height:0;}
        .v2110-studio-grid .v219-compact {padding:8px;}
        .v2110-studio-grid .v219-compact .v219-strip {max-height:110px;}
        .v2110-studio-grid .v219-compact .v219-strip img {height:52px;}
        .v2110-studio-grid .v219-hero {height:clamp(160px,20vw,260px)!important;max-height:260px!important;}
        .v2110-drop-active {outline:2px dashed #a78bfa!important;background:rgba(139,92,246,.12)!important;}
        @media(max-width:1100px){.v2110-studio-grid{grid-template-columns:1fr 1fr}.v2110-studio-grid>*{height:auto;max-height:none}.v2110-studio-grid>*:last-child{grid-column:1/-1}}
        @media(max-width:760px){.v2110-main-grid,.v2110-studio-grid{grid-template-columns:1fr}.v2110-studio-grid>*:last-child{grid-column:auto}.v2110-controls{max-height:none}.v2110-reference{height:auto}}
        .v219-hero { height:clamp(220px,34vw,490px); max-height:56vh; }
        .v219-strip { scrollbar-width:thin; }
        .v219-compact { background:#0B0E16; border-color:rgba(255,255,255,.08); }
        .v219-compact .v219-strip img { height:52px; }
        @media(max-width:900px){.v219-hero{height:clamp(190px,48vw,340px)}.v219-workspace{padding:10px}}
        
        .v219-workspace button, .v219-workspace select { max-width:100%; }
        .v219-workspace .v219-strip button { display:block; }
        @media(min-width:1200px){.v219-workspace:not(.v219-compact) .v219-hero{height:min(37vw,460px)}}
        select, option, input, textarea {
            color-scheme: dark !important;
        }
        select {
            background-color: #141824 !important;
            color: #ffffff !important;
            border-color: rgba(255, 255, 255, 0.22) !important;
        }
        select:focus {
            border-color: #8B5CF6 !important;
            outline: none !important;
        }
        option {
            background-color: #121622 !important;
            color: #ffffff !important;
            font-weight: 500 !important;
            padding: 8px 12px !important;
        }
        option:hover, option:focus, option:checked {
            background-color: #7C3AED !important;
            color: #ffffff !important;
        }
        input[type="checkbox"] {
            accent-color: #8B5CF6 !important;
            cursor: pointer;
        }

        button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible {
            outline: 2px solid #8B5CF6;
            outline-offset: 1px;
        }

        :root{--af-bg:#080a10;--af-panel:#10131d;--af-panel-2:#0d1018;--af-edge:rgba(187,195,230,.11);--af-muted:#99a2b8;--af-accent:#a78bfa;--af-shadow:0 16px 48px rgba(0,0,0,.24)}
        html{scroll-behavior:smooth}
        body{background:var(--af-bg);color:#e7eaf4;letter-spacing:-.006em}
        button,input,select,textarea{font-family:inherit}
        button{transition:background-color .16s,border-color .16s,box-shadow .16s,filter .16s,transform .16s}
        button:disabled{filter:saturate(.6)}
        ::selection{background:rgba(139,92,246,.36);color:#fff}
        .af-v234-app{background:radial-gradient(1000px 440px at 45% -190px,rgba(132,89,255,.18),transparent 74%),radial-gradient(800px 400px at 100% 20%,rgba(52,67,147,.08),transparent 76%),var(--af-bg)}
        .af-v234-top{box-shadow:0 12px 34px rgba(0,0,0,.28);border-bottom:1px solid rgba(255,255,255,.055)}
        .af-v234-header{background:linear-gradient(180deg,rgba(15,17,27,.98),rgba(11,13,21,.96));border-bottom:1px solid var(--af-edge)}
        .af-v234-header-inner{min-height:64px;gap:12px}
        .af-v234-brand{font-size:17px;letter-spacing:-.045em;white-space:nowrap}
        .af-v234-brand .af-v234-logo{display:inline-flex;width:32px;height:32px;align-items:center;justify-content:center;border:1px solid rgba(167,139,250,.34);border-radius:11px;background:linear-gradient(140deg,rgba(139,92,246,.25),rgba(139,92,246,.04));box-shadow:0 0 22px rgba(139,92,246,.12)}
        .af-v234-version{font-family:'JetBrains Mono',monospace;letter-spacing:.01em}
        .af-v234-tabs{padding:4px;border:1px solid rgba(255,255,255,.075);border-radius:14px;background:rgba(255,255,255,.024);gap:3px}
        .af-v234-tab{border-radius:10px;min-height:35px;padding:8px 12px;white-space:nowrap;letter-spacing:.002em}
        .af-v234-tab.active{color:#fff;background:linear-gradient(180deg,rgba(139,92,246,.27),rgba(105,73,212,.14));border-color:rgba(167,139,250,.5);box-shadow:0 0 0 2px rgba(139,92,246,.07),0 8px 18px rgba(80,45,154,.14)}
        .af-v234-actions{gap:8px}
        .af-v234-actions>label{border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:8px 9px;background:rgba(255,255,255,.022);font-size:11px}
        .af-v234-actions>button{min-height:34px}
        .af-v234-main{padding-top:18px;padding-bottom:44px}
        .af-v234-main section.rounded-2xl,.af-v234-main .rounded-2xl.border{border-color:var(--af-edge);box-shadow:var(--af-shadow);background-image:linear-gradient(155deg,rgba(20,24,36,.98),rgba(11,14,23,.98))}
        .af-v234-main .rounded-xl.border{border-color:rgba(255,255,255,.095)}
        .af-v234-main h2,.af-v234-main h3{letter-spacing:-.02em}
        .af-v234-main .v219-hero,.af-v234-main .v2110-reference{border-radius:14px}
        .af-v234-main .v219-strip{padding:5px 1px 9px;scrollbar-color:#45405f transparent}
        .af-v234-main .v219-strip img{border-radius:7px}
        .af-v234-main .v219-strip button{transition:transform .15s,border-color .15s}
        .af-v234-main .v219-strip button:hover{transform:translateY(-2px)}
        .af-v234-main input:not([type=checkbox]):not([type=radio]):not([type=file]),.af-v234-main textarea,.af-v234-main select{background:#121726!important;border-color:rgba(255,255,255,.16)!important;border-radius:10px;min-height:35px}
        .af-v234-main textarea{line-height:1.55}
        .af-v234-main input:focus,.af-v234-main textarea:focus,.af-v234-main select:focus{box-shadow:0 0 0 3px rgba(139,92,246,.14)}
        .af-v234-main button.bg-gradient-to-b,.af-v234-actions button.bg-gradient-to-b{box-shadow:0 7px 22px rgba(107,72,220,.2),inset 0 1px 0 rgba(255,255,255,.16)}
        .af-v234-main .sc::-webkit-scrollbar-thumb{background:#49435e}
        .af-v234-main .v2110-controls{scrollbar-color:#37324b transparent}
        .af-v234-main .v2110-studio-grid{gap:15px}
        .af-v234-main .v2110-main-grid{gap:15px}
        .af-v234-main .v219-compact{background:#0f131e;border-color:rgba(255,255,255,.1)}
        .af-v234-main details>summary{padding:5px 0}
        .af-v234-main img{image-rendering:auto}
        .af-v234-context{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 13px;padding:13px 16px;border:1px solid rgba(174,186,221,.13);border-radius:15px;background:linear-gradient(110deg,rgba(36,30,62,.60),rgba(16,21,33,.85) 46%,rgba(13,18,29,.95));box-shadow:0 9px 32px rgba(0,0,0,.13)}
        .af-v234-context-head{display:flex;align-items:center;gap:12px;min-width:0}
        .af-v234-context-mark{width:35px;height:35px;display:grid;place-items:center;border:1px solid rgba(167,139,250,.32);border-radius:11px;background:rgba(139,92,246,.14);color:#c4b5fd;font-size:17px;flex-shrink:0}
        .af-v234-context h1{font-size:15px;font-weight:750;line-height:1.25;letter-spacing:-.025em;color:#f7f6ff}
        .af-v234-context p{font-size:11px;color:#a7aec1;margin-top:3px;line-height:1.45}
        .af-v234-context-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:10px;color:#aeb6cc}
        .af-v234-context-chip{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:8px;background:rgba(8,12,20,.62);border:1px solid rgba(255,255,255,.085);white-space:nowrap}
        .af-v234-context-chip strong{font-weight:650;color:#e4d9ff}

        .cinema-studio{--cinema-purple:#9d79ff;}
        .cinema-studio .v2110-studio-grid{display:grid!important;grid-template-columns:minmax(270px,1fr) minmax(300px,1.06fr) minmax(330px,1.14fr)!important;gap:14px!important;align-items:stretch}
        .cinema-studio .v2110-studio-grid>div{height:auto!important;max-height:none!important}

        .sb-sheet-top4x3{display:flex;flex-direction:column;gap:10px;background:#070910;border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:10px}
        .sb-hero-wide{position:relative;border-radius:12px;overflow:hidden;background:radial-gradient(ellipse at 50% 35%,#1d223f,#070a12 75%);border:1px solid rgba(255,255,255,.12);aspect-ratio:16 / 9;max-height:360px;width:100%;display:flex;align-items:center;justify-content:center}

        .sb-grid-4x3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;background:#f8fafc;padding:8px;border-radius:10px}
        .sb-card-4x3{display:flex;flex-direction:column;background:#ffffff;border-radius:4px;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.18)}

        .sb-card-4x3-img img{width:100%;height:100%;object-fit:cover;display:block}
        .sb-card-4x3-num{position:absolute;top:5px;left:5px;z-index:2;background:rgba(10,14,23,.88);color:#fff;font-size:10px;font-weight:800;padding:1px 6px;border-radius:3px}
        .sb-card-4x3-bar{display:flex;align-items:center;justify-content:space-between;gap:4px;padding:5px 6px;background:#ffffff;color:#0f172a;font-size:9.5px;line-height:1.2;border-top:1px solid #e2e8f0}
