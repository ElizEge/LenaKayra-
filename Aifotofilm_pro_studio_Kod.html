<!-- Kalıcı tasarım kararı: Pafta oranları yalnızca 16:9, 9:16, 4:5. Storyboard sayıları 3/6/9/12; yeni çalışma 3 kareyle başlar. 2 kare başlangıç-bitiş video akışında ele alınır. -->
<!-- V37 Final kararları: V36 API/model/SYS katmanı korunmuştur. Beş ana sekme; Storyboard içinde video hazırlığı. Ortak Image Lab düzenleme ve onayla kaynak kareye dönüş. Yeniden üretimde kare kimliği korunur, son iki sürüm geri alınabilir. Yerel prompt aç/kapat. Birleşik Studio referans kaynağı. Influencer story bağlamı, kıyafet ve ortam kilidi. Bağımlı video promptları kaynak değişiminde uyarılır. Kontroller: JSX derleme, ilk bileşen render testi, yerinde değiştirme testleri, API/SYS eşitliği. Canlı API ve tarayıcı görsel kontrolü bu ortamda yapılmadı. -->
<!-- V39: Studio (AI açı ölçer dahil) + Image Lab + Storyboard. Influencer ayrı proje: AiFotofilm Influencer Studio. -->
<!-- V38: Storyboard tek akış (pafta içinde ilk/son kare + final video promptları), daralan seçiciler, sadeleştirilmiş Influencer ve Image Lab. API katmanı, modeller ve SYS metinleri V37.4 RC1 ile bayt bayt aynıdır. -->

/* V38 · Daralan seçiciler ve geniş önizleme */
.rail-grid{transition:grid-template-columns .28s ease}
.rail-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11px;color:#94a3b8;padding:0 2px}
.rail-collapse{font-size:11px;font-weight:700;color:#c4b5fd;border:1px solid rgba(139,92,246,.35);background:rgba(139,92,246,.1);border-radius:8px;padding:4px 10px}
.rail-collapse:hover{background:rgba(139,92,246,.22);color:#fff}
.rail-summary{position:sticky;top:76px;align-self:start;display:flex;flex-direction:column;gap:8px;min-width:0;border:1px solid #2a3153;border-radius:16px;background:linear-gradient(160deg,#161c32,#101629);padding:10px;box-shadow:0 9px 25px #0003}
.rail-open{display:flex;align-items:center;justify-content:space-between;gap:6px;width:100%;text-align:left;font-size:12px;font-weight:700;color:#ece7ff;padding:6px 8px;border-radius:10px;background:rgba(139,92,246,.16);border:1px solid rgba(139,92,246,.35)}
.rail-open b{font-size:10.5px;color:#c4b5fd;white-space:nowrap}
.rail-open:hover{background:rgba(139,92,246,.28)}
.rail-items{display:flex;flex-direction:column;gap:2px}

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        const pad = (n) => String(n).padStart(2, "0");
        const APP_VERSION = '42.1.0';

        /* Güvenli Depolama ve Pano Katmanı */
        (() => {
            try {
                const w = typeof window !== 'undefined' ? window : {};
                const mem = new Map();
                let real = null;
                try {
                    const s = w.localStorage;
                    w.__afOriginalStorage = s;
                    s.setItem('__p__', '1');
                    s.removeItem('__p__');
                    real = s;
                } catch (e) { real = null; }
                w.__afStorageDegraded = () => !real || mem.size > 0;
                const signalStorage = () => {
                    try { w.dispatchEvent(new CustomEvent('af-storage-status')); } catch (e) { }
                };
                w.__afRetryStorage = () => {
                    if (!real) {
                        try {
                            const candidate = w.__afOriginalStorage;
                            candidate?.setItem('__p__', '1');
                            candidate?.removeItem('__p__');
                            real = candidate || null;
                        } catch (e) { }
                    }
                    if (real) {
                        for (const [k, v] of mem) {
                            try { real.setItem(k, v); mem.delete(k); } catch (e) { break; }
                        }
                    }
                    signalStorage();
                    return !!real && mem.size === 0;
                };
                const keys = () => { const k = new Set(mem.keys()); if (real) for (let n = 0; n < real.length; n++) k.add(real.key(n)); return k; };
                const hybrid = {
                    getItem(k) { const key = String(k); if (mem.has(key)) return mem.get(key); try { return real ? real.getItem(key) : null; } catch (e) { return null; } },
                    setItem(k, v) {
                        const key = String(k), val = String(v);
                        if (real) {
                            try {
                                real.setItem(key, val);
                                mem.delete(key);
                                if (!mem.size) signalStorage();
                                return;
                            } catch (e) { }
                        }
                        const first = !mem.size;
                        mem.set(key, val);
                        if (first) signalStorage();
                    },
                    removeItem(k) { const key = String(k); mem.delete(key); try { real && real.removeItem(key); } catch (e) { } },
                    clear() { mem.clear(); try { real && real.clear(); } catch (e) { } },
                    key(i) { try { return Array.from(keys())[i] ?? null; } catch (e) { return null; } },
                    get length() { try { return keys().size; } catch (e) { return mem.size; } }
                };
                try { Object.defineProperty(w, 'localStorage', { value: hybrid, configurable: true, writable: true }); } catch (e) { }
                const nav = w.navigator;
                const origWrite = nav?.clipboard?.writeText ? nav.clipboard.writeText.bind(nav.clipboard) : null;
                const safeWriteText = async (text) => {
                    const str = String(text ?? '');
                    if (origWrite) { try { await origWrite(str); return; } catch (e) { } }
                    try {
                        const ta = document.createElement('textarea'); ta.value = str; ta.setAttribute('readonly', '');
                        ta.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(ta); ta.select();
                        const copied = document.execCommand('copy'); document.body.removeChild(ta);
                        if (!copied) throw new Error('Pano kopyalaması başarısız.');
                    } catch (e) {
                        throw new Error('Pano erişimi başarısız.');
                    }
                };
                try { Object.defineProperty(nav, 'clipboard', { value: { writeText: safeWriteText, readText: async () => '' }, configurable: true }); } catch (e) { }
            } catch (e) { }
        })();

        const ASSET_DB = 'aifotofilm_assets', ASSET_STORE = 'kv', ASSET_KEY = 'assets';
        const idbOpen = () => new Promise((res, rej) => {
            try {
                if (typeof indexedDB === 'undefined') return rej(new Error('IndexedDB bu tarayıcıda desteklenmiyor veya engellendi.'));
                const r = indexedDB.open(ASSET_DB, 1);
                r.onupgradeneeded = () => { try { r.result.createObjectStore(ASSET_STORE); } catch (e) { } };
                r.onsuccess = () => res(r.result);
                r.onerror = () => rej(r.error || new Error('IndexedDB açılamadı.'));
                r.onblocked = () => rej(new Error('IndexedDB başka bir sekme tarafından kilitlendi.'));
            } catch (e) { rej(e); }
        });

        const idbGetLegacy = async (k) => {
            const db = await idbOpen();
            return new Promise((res, rej) => {
                try {
                    const tx = db.transaction(ASSET_STORE, 'readonly');
                    const t = tx.objectStore(ASSET_STORE).get(k);
                    t.onsuccess = () => { db.close(); res(t.result); };
                    t.onerror = () => { const err = t.error || new Error('Okuma hatası'); db.close(); rej(err); };
                    tx.onabort = () => { const err = tx.error || new Error('İşlem iptal edildi'); db.close(); rej(err); };
                } catch (e) { db.close(); rej(e); }
            });
        };

        const idbSetLegacy = async (k, v) => {
            const db = await idbOpen();
            return new Promise((res, rej) => {
                try {
                    const tx = db.transaction(ASSET_STORE, 'readwrite');
                    tx.objectStore(ASSET_STORE).put(v, k);
                    tx.oncomplete = () => { db.close(); res(true); };
                    tx.onerror = () => { const err = tx.error || new Error('IndexedDB kayıt hatası'); db.close(); rej(err); };
                    tx.onabort = () => { const err = tx.error || new Error('IndexedDB işlemi iptal edildi'); db.close(); rej(err); };
                } catch (e) { db.close(); rej(e); }
            });
        };

        // Asset-record storage: existing DB/store unchanged, atomic first migration.
        const mediaUrlBlobs = new Map();
        const mediaExportPins = new Set();
        const mediaUrlFor = (blob) => {
            const url = URL.createObjectURL(blob);
            mediaUrlBlobs.set(url, blob);
            return url;
        };
        const portableImageValue = async (value) => {
            if (typeof value === 'string' && value.startsWith('blob:')) {
                const blob = mediaUrlBlobs.get(value);
                if (!blob) throw new Error('Geçici görsel bağlantısı bulunamadı.');
                return readStoredBlob(blob);
            }
            if (Array.isArray(value)) {
                const out = [];
                for (const v of value) out.push(await portableImageValue(v));
                return out;
            }
            if (value && typeof value === 'object') {
                const out = {};
                for (const [k, v] of Object.entries(value)) if (k !== 'thumbUrl') out[k] = await portableImageValue(v);
                return out;
            }
            return value;
        };
        const pruneMediaUrls = (values) => {
            const keep = new Set();
            const scan = (v) => {
                if (typeof v === 'string') { if (v.startsWith('blob:')) keep.add(v); }
                else if (Array.isArray(v)) v.forEach(scan);
                else if (v && typeof v === 'object') Object.values(v).forEach(scan);
            };
            scan(values);
            scan(Array.from(mediaExportPins));
            for (const [url] of mediaUrlBlobs) if (!keep.has(url)) {
                URL.revokeObjectURL(url);
                mediaUrlBlobs.delete(url);
            }
        };
        const encodeStoredImages = (value) => {
            if (typeof value === 'string' && value.startsWith('blob:')) {
                const blob = mediaUrlBlobs.get(value);
                if (!blob) throw new Error('Kayıt için geçici görüntü bulunamadı.');
                return blob;
            }
            if (typeof value === 'string' && /^data:image\/[a-zA-Z0-9.+-]+;base64,/.test(value)) {
                const i = value.indexOf(','), mime = value.slice(5, value.indexOf(';')), binary = atob(value.slice(i + 1)), bytes = new Uint8Array(binary.length);
                for (let n = 0; n < binary.length; n++) bytes[n] = binary.charCodeAt(n);
                return new Blob([bytes], { type: mime });
            }
            if (Array.isArray(value)) return value.map(encodeStoredImages);
            if (value && typeof value === 'object' && !(value instanceof Blob)) return Object.fromEntries(Object.entries(value).map(([k, v]) => [k, encodeStoredImages(v)]));
            return value;
        };
        const blobReadPool = { active: 0, queue: [] };
        const readStoredBlob = (value) => new Promise((resolve, reject) => {
            const pump = () => {
                while (blobReadPool.active < 2 && blobReadPool.queue.length) {
                    blobReadPool.active++;
                    blobReadPool.queue.shift()();
                }
            };
            blobReadPool.queue.push(() => {
                new Promise((res, rej) => {
                    const reader = new FileReader();
                    reader.onload = () => res(reader.result);
                    reader.onerror = () => rej(reader.error || new Error('Görsel kaydı okunamadı.'));
                    reader.readAsDataURL(value);
                }).then(resolve, reject).finally(() => {
                    blobReadPool.active--;
                    pump();
                });
            });
            pump();
        });
        const mapStoredLimited = async (values) => {
            const result = new Array(values.length);
            let next = 0;
            const worker = async () => {
                while (next < values.length) {
                    const i = next++;
                    result[i] = await decodeStoredImages(values[i]);
                }
            };
            await Promise.all(Array.from({ length: Math.min(2, values.length) }, worker));
            return result;
        };
        const decodeStoredImages = async (value) => {
            if (value instanceof Blob) return mediaUrlFor(value);
            if (typeof value === 'string' && /^data:image\/[a-zA-Z0-9.+-]+;base64,/.test(value)) return mediaUrlFor(encodeStoredImages(value));
            if (Array.isArray(value)) return mapStoredLimited(value);
            if (value && typeof value === 'object') {
                const out = {};
                for (const [k, v] of Object.entries(value)) out[k] = await decodeStoredImages(v);
                return out;
            }
            return value;
        };
        const RECORD_INDEX = 'assets.records.rc4', RECORD_PREFIX = 'asset.rc4:';
        let recordVersion = null;
        let storageWriteLocked = false;
        let recordCache = new Map();
        const shallowAssetEqual = (a, b) => !!a && !!b && Object.keys(a).length === Object.keys(b).length && Object.keys(a).every(k => a[k] === b[k]);

        const idbGet = async (k) => {
            if (k !== ASSET_KEY) return idbGetLegacy(k);
            const db = await idbOpen();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(ASSET_STORE, 'readonly'), store = tx.objectStore(ASSET_STORE);
                let result, failed = false;
                const fail = (e) => { if (!failed) { failed = true; reject(e || new Error('Varlık kaydı okunamadı.')); } };
                const request = store.get(RECORD_INDEX);
                request.onsuccess = () => {
                    const index = request.result;
                    if (!index) {
                        const old = store.get(ASSET_KEY);
                        old.onsuccess = () => { result = old.result; recordVersion = null; recordCache = new Map(); };
                        return;
                    }
                    if (![1, 2].includes(index.schema) || !Array.isArray(index.ids) || new Set(index.ids).size !== index.ids.length) {
                        fail(new Error('Varlık indeksi geçersiz; mevcut kayıtlar korunuyor.'));
                        return;
                    }
                    result = new Array(index.ids.length);
                    index.ids.forEach((id, i) => {
                        const r = store.get(RECORD_PREFIX + id);
                        r.onsuccess = () => {
                            if (!r.result || r.result.id !== id) { fail(new Error('Eksik varlık kaydı: ' + id)); return; }
                            result[i] = r.result;
                        };
                    });
                    recordVersion = index.version;
                };
                tx.oncomplete = async () => {
                    db.close();
                    if (!failed) {
                        try {
                            result = await decodeStoredImages(result);
                            if (recordVersion !== null) recordCache = new Map((result || []).map(a => [a.id, { ...a }]));
                            resolve(result);
                        } catch (e) { reject(e); }
                    }
                };
                tx.onerror = () => { fail(tx.error); db.close(); };
                tx.onabort = () => { fail(tx.error); db.close(); };
            });
        };

        const idbSet = async (k, assets) => {
            if (k !== ASSET_KEY) return idbSetLegacy(k, assets);
            if (storageWriteLocked) throw new Error('Depolama yazımı durduruldu. JSON yedeği alıp yeniden yükleyin.');
            if (!Array.isArray(assets) || assets.some(a => !a || typeof a.id !== 'string') || new Set(assets.map(a => a.id)).size !== assets.length) throw new Error('Varlık kaydı doğrulanamadı.');
            const db = await idbOpen();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(ASSET_STORE, 'readwrite'), store = tx.objectStore(ASSET_STORE);
                let failure = null, newVersion, changed = 0;
                const req = store.get(RECORD_INDEX);
                req.onsuccess = () => {
                    try {
                        const index = req.result;
                        if ((index?.version ?? null) !== recordVersion) {
                            storageWriteLocked = true;
                            failure = new Error('Proje başka bir açık sekmede değişti. Bu sekmedeki çalışmayı JSON olarak yedekleyip yeniden yükleyin.');
                            tx.abort();
                            return;
                        }
                        newVersion = (index?.version || 0) + 1;
                        const ids = assets.map(a => a.id), keep = new Set(ids);
                        for (const a of assets) {
                            if (index?.schema !== 2 || !shallowAssetEqual(recordCache.get(a.id), a)) {
                                store.put(encodeStoredImages(a), RECORD_PREFIX + a.id);
                                changed++;
                            }
                        }
                        for (const id of index?.ids || []) if (!keep.has(id)) store.delete(RECORD_PREFIX + id);
                        store.put({ schema: 2, version: newVersion, ids, updatedAt: Date.now() }, RECORD_INDEX);
                        store.delete(ASSET_KEY);
                    } catch (e) { failure = e; tx.abort(); }
                };
                tx.oncomplete = () => {
                    recordVersion = newVersion;
                    recordCache = new Map(assets.map(a => [a.id, { ...a }]));
                    db.close();
                    resolve({ changedRecords: changed, totalRecords: assets.length });
                };
                const fail = () => { db.close(); reject(failure || tx.error || new Error('Varlık kaydı tamamlanamadı.')); };
                tx.onerror = fail;
                tx.onabort = fail;
            });
        };

        const isQuotaError = (err) => {
            if (!err) return false;
            const name = String(err.name || '');
            const msg = String(err.message || '').toLowerCase();
            return name === 'QuotaExceededError' || name === 'NS_ERROR_DOM_QUOTA_REACHED' || err.code === 22 || msg.includes('quota') || msg.includes('storage') || msg.includes('dolu');
        };

        const mergeAssetLists = (existingList = [], incomingList = []) => {
            const map = new Map();
            (Array.isArray(existingList) ? existingList : []).forEach(a => { if (a && a.id) map.set(a.id, a); });
            (Array.isArray(incomingList) ? incomingList : []).forEach(a => {
                if (a && a.id) {
                    const prev = map.get(a.id);
                    map.set(a.id, prev ? { ...prev, ...a } : a);
                }
            });
            return Array.from(map.values()).sort((a, b) => {
                const tA = Number(a.createdAt || a.created || parseInt(String(a.id || ''), 36) || 0);
                const tB = Number(b.createdAt || b.created || parseInt(String(b.id || ''), 36) || 0);
                return tA - tB;
            });
        };

        const idbSaveQueue = {
            pending: null,
            running: false,
            enqueue(snapshot, onStatus) {
                this.pending = snapshot;
                if (!this.running) {
                    this.drain(onStatus);
                }
            },
            async drain(onStatus) {
                this.running = true;
                while (this.pending !== null) {
                    const currentSnapshot = this.pending;
                    this.pending = null;
                    onStatus?.('saving');
                    try {
                        await idbSet(ASSET_KEY, currentSnapshot);
                        onStatus?.('saved');
                    } catch (err) {
                        onStatus?.('error', err);
                    }
                }
                this.running = false;
            }
        };

        const detectMimeType = (dataUrl) => {
            if (mediaUrlBlobs.has(dataUrl)) return mediaUrlBlobs.get(dataUrl).type || 'image/jpeg';
            const m = /^data:(image\/[a-zA-Z0-9.+-]+);base64,/.exec(dataUrl || '');
            return m ? m[1].toLowerCase() : 'image/jpeg';

        const Inspector = ({ items, start, onClose, S }) => {

            const del = () => { S.delAsset(it.id); const nl = list.filter(x => x.id !== it.id); if (!nl.length) return onClose(); setList(nl); setI(Math.min(i, nl.length - 1)); reset(); };

            useEffect(() => {
                const prev = document.body.style.overflow; document.body.style.overflow = 'hidden';
                const el = stage.current;
                const wheel = (e) => { e.preventDefault(); e.stopPropagation(); zoom(e.deltaY < 0 ? 0.25 : -0.25); };
                el?.addEventListener('wheel', wheel, { passive: false });
                return () => { document.body.style.overflow = prev; el?.removeEventListener('wheel', wheel); };
            }, []);

            useEffect(() => {
                const k = (e) => {
                    if (e.key === 'Escape') onClose();
                    if (e.target?.closest?.('input,textarea,select,[contenteditable]')) return;
                    if (e.key === 'ArrowLeft') move(-1);
                    if (e.key === 'ArrowRight') move(1);
                    if (e.key === '+' || e.key === '=') zoom(0.25);

                    if (e.key === '0') reset();

                                onPointerDown={e => {if(e.target.closest('button'))return;drag.current={x:e.clientX-pan.x,y:e.clientY-pan.y,sx:e.clientX,sy:e.clientY};moved.current=0;try{e.currentTarget.setPointerCapture(e.pointerId);}catch(err){}}}
                                onPointerMove={e => {const d=drag.current;if(!d)return;moved.current=Math.max(moved.current,Math.abs(e.clientX-d.sx)+Math.abs(e.clientY-d.sy));if(zr.current>1)setPan({x:e.clientX-d.x,y:e.clientY-d.y});}}

                                    <button onClick={()=>move(1)} title="Sonraki Görsel (→)" className="absolute right-3 top-1/2 -translate-y-1/2 px-3 py-2.5 rounded-xl bg-black/75 hover:bg-[#8B5CF6] border border-white/15 text-white shadow-xl flex items-center gap-1.5 transition-all">
                                        <span className="text-[11px] font-semibold hidden sm:inline">Sonraki</span><Icons.ChevronRight/>

                                        <img loading="lazy" src={x.thumbUrl || x.url} alt={x.name||''} className="h-14 w-24 object-cover rounded"/>
                                        <span className="block text-[9.5px] text-slate-300 truncate max-w-[96px] mt-1">{n + 1}. {x.tag || x.name || 'Kare'}</span>
                                    </button>
                                ))}
                            </div>
                        </div>
                        {sideOpen&&<aside className="w-full lg:w-[310px] xl:w-[350px] lg:border-l border-t lg:border-t-0 border-white/10 bg-[#111622] flex flex-col max-h-[42vh] lg:max-h-none shrink-0">
                            <div className="px-3 pt-2 text-[11px] font-semibold text-[#C4B5FD]">{({studio:'Studio',reji:'Açı varyasyonu',lab:'Image Lab',next:'Next Frame',storyboard:'Storyboard',influencer:'Influencer',upload:'Harici görsel'})[live.type]||live.type} · Görsel araçları</div><div className="flex gap-1 p-2 border-b border-white/10">{[['tools','Araçlar'],['info','Bilgiler']].map(([id,t])=><button key={id} onClick={()=>setSideTab(id)} className={`flex-1 rounded-lg px-2 py-2 text-[12px] font-semibold ${sideTab===id?'bg-[#8B5CF6]/25 text-[#D8C8FF]':'text-slate-400 hover:bg-white/5'}`}>{t}</button>)}</div>
                            <div className="p-3 overflow-y-auto sc flex-1 flex flex-col gap-3">

        const useRail = (S, tab, types) => {

            const typeList = Array.isArray(types) ? types : [types];

            let count = 0, revs = 0;
            for (const a of S.assets) if (typeList.includes(a.type) && (!a.sceneId || a.sceneId === S.activeId)) { count++; revs += (a.revision || 0); }
            const sig = `${S.activeId}:${count}:${revs}`;
            const seen = useRef(sig), wasBusy = useRef(false), pending = useRef(false);

        const useScenario = (S, tab) => {

        /* V39 · AI açı ölçer: Reji'nin yerine. Aynı anı (ya da yalnızca promptu) farklı kamera konumlarından üretir. */
        const ANGLE_AZ = [
            { az: 0, tr: 'Önden', en: 'camera directly in front of the main subject, facing them head-on' },
            { az: 45, tr: 'Sağ 3/4', en: "three-quarter front view, camera placed toward the main subject's right side" },
            { az: 90, tr: 'Sağ profil', en: "side profile view, camera at the main subject's right side" },
            { az: 135, tr: 'Sağ arka', en: "three-quarter rear view from behind the main subject's right shoulder (over-the-shoulder)" },
            { az: 180, tr: 'Arkadan', en: 'rear view, camera directly behind the main subject' },
            { az: -135, tr: 'Sol arka', en: "three-quarter rear view from behind the main subject's left shoulder (over-the-shoulder)" },
            { az: -90, tr: 'Sol profil', en: "side profile view, camera at the main subject's left side" },
            { az: -45, tr: 'Sol 3/4', en: "three-quarter front view, camera placed toward the main subject's left side" }

        const ANGLE_EL = [
            { id: 'ground', tr: 'Zemin', en: 'ground-level camera with the lens near the floor, looking up' },
            { id: 'low', tr: 'Alt açı', en: 'low-angle camera looking slightly upward' },
            { id: 'eye', tr: 'Göz hizası', en: 'eye-level camera' },
            { id: 'high', tr: 'Üst açı', en: 'high-angle camera looking down' },

            { id: 'wide', tr: 'Geniş', en: 'wide shot showing full bodies and the environment' },

        const nearAz = (v) => { const n = Number(v) || 0; return ANGLE_AZ.reduce((b, x) => Math.abs(((x.az - n + 540) % 360) - 180) < Math.abs(((b.az - n + 540) % 360) - 180) ? x : b, ANGLE_AZ[0]); };
        const angleLabel = (g) => `${nearAz(g.az).tr} · ${(ANGLE_EL.find(x => x.id === g.el) || ANGLE_EL[2]).tr} · ${(ANGLE_DIST.find(x => x.id === g.dist) || ANGLE_DIST[1]).tr}`;

            const continuity = async (sig) => {

                const sys = `You are a cinematographer and film editor. Choose ${n} camera positions that cover THE SAME FROZEN INSTANT of this scene for a strong, story-driven edit. Decide from the story beat, emotion, action direction and the 180-degree rule; give variety (establishing, reverse or over-the-shoulder, close reaction, detail) only where the story needs it, and avoid repeating the reference camera. Pick only camera positions physically possible inside this set and right for the story beat; characters stay exactly where they are. Azimuth = camera position around the main subject in degrees: 0 front, 45 subject's right three-quarter, 90 right profile, 135 behind right shoulder, 180 behind, -45 / -90 / -135 the left-side equivalents. Elevation is one of ground|low|eye|high|top. Distance is one of wide|medium|close|detail. Return ONLY JSON: {"angles":[{"az":45,"el":"eye","dist":"medium","label_tr":"short Turkish shot name","reason_tr":"one short Turkish sentence: what this angle adds to the story","focus_en":"what the frame focuses on, in English"}]}`;
                const r = base ? await callGeminiWithImages(brief, [base], true, sys, sig) : await callGemini(brief, true, sys, sig);
                chk(sig);
                const angles = (Array.isArray(r?.angles) ? r.angles : []).slice(0, n).map(x => ({ az: nearAz(x.az).az, el: ANGLE_EL.some(e => e.id === x.el) ? x.el : 'eye', dist: ANGLE_DIST.some(d => d.id === x.dist) ? x.dist : 'medium', label_tr: String(x.label_tr || '').slice(0, 40), reason_tr: String(x.reason_tr || ''), focus_en: String(x.focus_en || '') }));
                need(angles, 'AI açı öneremedi; manuel açıyla deneyin.');
                for (let i = 0; i < angles.length; i++) {
                    chk(sig); prog((i + 0.2) / angles.length, angles[i].label_tr || angleLabel(angles[i]));
                    await shoot(angles[i], sig, refs, base, cp);
                }
                S.notify(`${angles.length} açı üretildi.`);
            });
            const redo = (r) => S.run(`angle.r.${r.id}`, 'studio', `Açı yenileniyor · ${r.g.label_tr || angleLabel(r.g)}`, async (sig) => {
                const { refs, base, cp } = await prep(sig);

            const audit = () => S.run('angle.audit', 'studio', 'Açı sürekliliği denetimi', async (sig) => {
                need(src && list.length, 'Denetim için kaynak görsel ve en az bir açı gerekir.');

                S.notify('Açılar kaynak görselle karşılaştırıldı.');
            });
            const busy = S.busy('angle.ai') || S.busy('angle.one');
            const R = 54, C = 70;

            return (
                <Box title="Açılar · AI açı ölçer" right={<span className="text-[10px] text-slate-400">{list.length ? `${list.length} açı` : 'Aynı anı farklı kameradan'}</span>}>
                    {pickOpen && <LibraryPicker S={S} onClose={() => setPickOpen(false)} onPick={(id) => { setSrcId(id); setPickOpen(false); }} />}

                        {src ? <img src={src.thumbUrl || src.url} alt="" /> : <span className="angle-src-ph">P</span>}
                        <div className="min-w-0 flex-1">
                            <div className="text-[11px] font-bold text-white truncate">{src ? src.name : 'Yalnızca master prompt'}</div>
                            <div className="text-[10px] text-slate-400 truncate">{picked ? 'Seçilen referans' : src ? 'Studio master görseli' : 'Görsel yok: açılar prompttan üretilir'}</div>
                        </div>
                        <Btn tone="g" onClick={() => setPickOpen(true)}>Kaynak seç</Btn>
                        {picked && <Btn tone="g" onClick={() => setSrcId(null)}>Master'a dön</Btn>}
                    </div>
                    <div className="angle-grid">

                            <circle cx={C} cy={C} r={R} className="angle-ring" />

                            <path d={`M${C} ${C - 10} l-4 -7 h8 z`} className="angle-face" />

                                const px = C + R * Math.sin(x.az * Math.PI / 180), py = C - R * Math.cos(x.az * Math.PI / 180);

                                                <img src={a.url} alt={a.name} loading="lazy" />
                                                <span className="cam-tag">{nearAz(r.g.az).tr}</span>
                                                {v && <span className="absolute top-2 right-2"><Badge v={v} /></span>}

                                                    <Xfer a={a} S={S} />

                    continuityManifest: core?.continuity_manifest || null,
                    manifest: core?.continuity_manifest ? JSON.stringify(core.continuity_manifest) : '',
                    prompt: '',
                    pre: null
                });
                S.notify(empty ? `AI özgün sahne planı oluşturdu (Önerilen oran: ${aiRecRatio}).` : `Fikir sahne planına dönüştü (Oran: ${b.ratio !== 'any' ? b.ratio : aiRecRatio}). Şimdi Master Prompt derleyebilirsiniz.`);

            const compile = () => S.run('studio.compile', 'studio', 'Master prompt derleniyor', async (sig) => {
                need(S.cast, 'Master Prompt için en az bir karakter seçin.');
                const activeScenario = (b.scenario || idea || '').trim();
                need(activeScenario, 'Önce sahne fikri yazın veya planlatın.');
                const info = S.cast.map(c => `[NAME: ${c.ad.toUpperCase()}, SEX: ${c.sex}, GENDER LOCK: ${c.genderLock}, APPEARANCE: ${cleanCastDna(c.dna)}]`).join('\n');
                const plan = b.plan;
                const camEn = [opt(CAMERA_SETUPS, b.setup), opt(CAMERA_ANGLES, b.angle)].filter(Boolean).join(', ') || 'Dynamic cinematic composition';
                const over = plan ? [plan.location && `Location: ${plan.location}`, plan.time && `Time: ${plan.time}`, plan.weather && `Weather: ${plan.weather}`, plan.action_tr && `Action: ${plan.action_tr}`, plan.director_intent_tr && `Director Intent: ${plan.director_intent_tr}`].filter(Boolean).join('\n') : '';
                const sys = `You are AiFotofilm Master Prompt Director.\nCRITICAL PRIORITY: Translate the USER IDEA and SCENE SCENARIO into a vivid, faithful English photographic generation prompt. The environment, action, props, mood and clothing MUST 100% match the user's scenario. Never turn the scene into a generic fashion shoot or unrelated location.\nACTIVE CAST:\n${info}\nWARDROBE CONTEXT: ${b.useOutfit ? S.cast.map(c => `${c.ad}: ${c.outfit}`).join(' | ') : (b.wardrobeText || 'Choose clothing that naturally fits the scenario and action')}\nCAMERA INTENT: ${camEn}\nChoose "recommended_aspect_ratio" carefully based on framing and user text ("9:16" for vertical/story/full-body mobile, "4:5" for portrait, "1:1" for square, "16:9" for wide cinematic, "21:9" for anamorphic widescreen).\n${J}\n{"master_environment_en":"","master_outfits_en":"","scene_action_en":"","composition_en":"","continuity_locks_en":"","negative_rules_en":"","recommended_aspect_ratio":"${RATIO_IDS.join('|')}"}`;
                const promptInput = [
                    idea.trim() && `USER ORIGINAL IDEA: ${idea.trim()}`,
                    `SCENE SCENARIO: ${activeScenario}`,
                    over && `STRUCTURED SCENE PLAN:\n${over}`
                ].filter(Boolean).join('\n\n');
                const r = await callGemini(promptInput, true, sys, sig);
                chk(sig);
                const light = [opt(LIGHT_TIMES, b.time), opt(LIGHT_STYLES, b.lightStyle)].filter(Boolean).join(', ');
                const atmo = [opt(SEASONS, b.season), opt(WEATHERS, b.weather)].filter(Boolean).join(', ');
                const textDetectedRatio = detectRatioFromText(`${idea || ''} ${activeScenario}`);
                const ratio = b.ratio !== 'any'
                    ? b.ratio
                    : (textDetectedRatio || (has(RATIOS, r.recommended_aspect_ratio) ? r.recommended_aspect_ratio : (b.recRatio || '16:9')));
                const outfits = b.useOutfit
                    ? S.cast.map((c) => `${c.ad.toUpperCase()} is wearing: ${c.outfit}.`).join(' ')
                    : (r.master_outfits_en || b.wardrobeText);
                let compiled = `SCENE & STORY ACTION: ${r.scene_action_en}. ENVIRONMENT & SETTING: ${r.master_environment_en}.${atmo ? ` ATMOSPHERE: ${atmo}.` : ''} CAST APPEARANCE: ${S.cast.map((c) => `[${c.ad.toUpperCase()} (${c.sex === 'male' ? 'adult man' : 'adult woman'}): ${cleanCastDna(c.dna)}]`).join(' ')}. WARDROBE IN THIS SCENE: ${outfits}. CAMERA & COMPOSITION: ${camEn}, ${r.composition_en}. CINEMATOGRAPHY & LIGHTING: ${light ? `${light}, ` : ''}${opt(STYLE_PRESETS, b.style) || 'Photorealistic cinematic lighting'}.${r.continuity_locks_en ? ` SCENE CONTINUITY: ${r.continuity_locks_en}.` : ''}${r.negative_rules_en ? ` AVOID: ${r.negative_rules_en}.` : ''} ASPECT RATIO: ${ratio}.`;
                let pf = null;
                if (S.engine) {
                    try { pf = await S.auditPrompt(compiled, sig, outfits); } catch (e) { if (isAbort(e)) throw e; }
                }
                S.patchScene({ scenario: b.scenario || activeScenario, prompt: compiled, recRatio: ratio, wardrobeText: outfits, pre: pf, promptStamp: stampOf(b.scenario || activeScenario) });
                S.pushLib(b.title, compiled);
                S.notify(`Master Prompt senaryoya sadık kalarak derlendi (Oran: ${ratio}).`);
                return true;
            });

            const adaptExt = () => S.run('studio.ext', 'studio', 'Harici prompt denetleniyor', async (sig) => {
                need(ext, 'Önce harici promptu yapıştırın veya görsel analiz edin.');
                const effectiveLock = preserveExtWardrobe
                    ? "PROMPT WARDROBE IS CANONICAL: Whatever clothing or swimwear (e.g. bikini, dress, casual) is described in this external prompt must be strictly kept. Do NOT replace with default outfits."
                    : (b.wardrobeText || S.lockText());
                const pf = await S.auditPrompt(ext, sig, effectiveLock);
                let finalPrompt = ext;
                if (pf?.fixed_prompt && pf.status !== 'ready') {
                    finalPrompt = preserveExtWardrobe ? ext : pf.fixed_prompt;
                }
                S.patchScene({
                    prompt: finalPrompt,
                    promptStamp: stampOf(b.scenario),
                    pre: pf,
                    useOutfit: preserveExtWardrobe ? false : b.useOutfit,
                    wardrobeText: preserveExtWardrobe ? "External/Analyzed Image Outfit is Canonical" : b.wardrobeText
                });
                S.notify(preserveExtWardrobe ? 'Harici prompt kadroya uyarlandı; görseldeki kıyafet korundu.' : 'Harici prompt kadro ve sahne kitabına göre denetlendi.');
            });

            const applyExtDirectly = () => {
                need(ext, 'Önce harici bir prompt girin.');
                S.patchScene({
                    prompt: ext,

                    wardrobeText: preserveExtWardrobe ? "External/Analyzed Image Outfit is Canonical" : b.wardrobeText
                });
                S.notify(preserveExtWardrobe ? 'Prompt master alana alındı (Görseldeki kıyafet kilitlendi).' : 'Harici prompt master prompt alanına alındı.');
            };

            const scnFromPrompt = () => S.run('studio.scn', 'studio', 'Senaryo çıkarılıyor', async (sig) => {
                const src = ext.trim() || b.prompt; need(src, 'Önce bir prompt yazın veya analiz edin.');
                S.patchScene({ scenario: (await callGemini(src, false, SYS.scn, sig)).trim() }); S.notify('Senaryo Sahne Kitabına yazıldı; tüm bağlı sekmeler kullanacak.');
            });

            const analyzeExtImage = () => S.run('studio.analyze', 'studio', 'Görsel analiz ediliyor', async (sig) => {
                need(extImgData, 'Lütfen önce analiz edilecek bir referans görsel seçin.');
                const res = await callGemini('Analyze this image and reconstruct its production-ready photographic master prompt (cast, exact clothing/outfit/swimwear worn in this image, camera, lens, lighting, environment). Describe the clothing in exact detail.', false, SYS.analyze, sig, extImgData.data, extImgData.mimeType);
                setExt(res.trim());
                setExtMode('text');
                if (preserveExtWardrobe) {
                    S.patchScene({
                        useOutfit: false,
                        wardrobeText: "Keep analyzed image clothing exactly as described in prompt"
                    });
                }
                S.notify('Görsel analiz edildi; prompt harici alana aktarıldı.');
            });

            const handleExtFile = (file) => {
                if (!file || !file.type.startsWith('image/')) return;
                const reader = new FileReader();
                reader.onload = () => {
                    const url = String(reader.result);
                    setExtImgPreview(url);
                    const s = split64(url);
                    if (s) setExtImgData(s);
                };
                reader.readAsDataURL(file);
            };

            const render = () => S.run('studio.render', 'studio', 'Master görsel üretiliyor', async (sig) => {
                need(b.prompt, 'Önce Master Prompt oluşturun.');
                const targetRatio = b.ratio !== 'any' ? b.ratio : (detectRatioFromText(b.prompt) || ideaRatio || b.recRatio || '16:9');

                const refs = await S.refsOf(S.cast, sig), seed = normalizeSeed(b.seed) ?? rnd();
                const a = await S.produce({ sig, type: 'studio', name: b.title, tag: 'MASTER', prompt: syncedPrompt, ratio: targetRatio, seed, refs, scenario: b.scenario || idea, extra: { wardrobe: b.wardrobeText } });
                if (a?.id) {

                    setResId(saved.id);

                    setFix(a.verdict?.fix_prompt_en || '');
                    S.notify(`Master görsel ${targetRatio} oranında üretildi.`);

            useEffect(() => { if (!res) return; return S.registerViewerAction(res.id,{key:'studio.render',regenerate:render}); },[res?.id,b.prompt,b.seed,eff]);

            /* V38 · Sahneden görsele tek tık: plan → master prompt → görsel. Her adım bir önceki tamamlanınca güncel sahneyle çalışır. */
            const flowTarget = useRef('render');

                            </button>
                            <div className="studio-settings-chips">
                                {[['Oran', b.ratio === 'any' ? `Oto (${eff})` : eff], ['Stil', trOf(STYLE_PRESETS, b.style)], ['Lens', trOf(CAMERA_SETUPS, b.setup)], ['Açı', trOf(CAMERA_ANGLES, b.angle)], ['Işık', trOf(LIGHT_TIMES, b.time)], ['Stil ışığı', trOf(LIGHT_STYLES, b.lightStyle)], ['Hava', trOf(WEATHERS, b.weather)], ['Mevsim', trOf(SEASONS, b.season)], ['Seed', b.seed || 'Rastgele'], ['Kıyafet', b.useOutfit ? 'Kilitli' : 'Sahneye göre']].map(([k, v]) => (
                                    <button type="button" key={k} className={`studio-chip ${v && !/^Oto|^Otomatik|^Rastgele|^Sahneye/.test(v) ? 'is-set' : ''}`} onClick={() => setSettingsOpen(true)}><i>{k}</i>{v}</button>
                                ))}
                            </div>
                            <Btn tone="g" onClick={() => S.patchScene({ style: 'any', setup: 'any', angle: 'any', ratio: 'any', time: 'any', lightStyle: 'any', weather: 'any', season: 'any' })} title="Tüm kamera, stil ve oran ayarlarını Otomatik yap">Tümü otomatik</Btn>
                        </div>
                        {settingsOpen && (

                                    {OPTS.map(([k, label, list]) => (
                                        <Sel

                                            label={label}
                                            list={list}
                                            value={b[k] || 'any'}
                                            onChange={(v) => k === 'ratio' ? handleRatioChange(v) : S.patchScene({ [k]: v })}
                                        />
                                    ))}
                                </div>
                                <div className="studio-settings-grid items-end">
                                    <Inp label="Seed (boş = rastgele)" value={b.seed} onChange={(v) => S.patchScene({ seed: v })} />
                                    <label className="flex items-center gap-2 text-[11.5px] text-slate-300 py-1.5">
                                        <input type="checkbox" className="accent-[#8B5CF6]" checked={b.useOutfit} onChange={e => S.patchScene({ useOutfit: e.target.checked })} />
                                        Varsayılan kıyafet kilidi
                                    </label>
                                </div>
                                {!!S.seeds?.length && <div className="flex flex-wrap items-center gap-1"><span className="text-[10px] text-slate-500">Son seed'ler:</span>{S.seeds.slice(0, 6).map((s) => <button key={s} onClick={() => S.patchScene({ seed: String(s) })} className="px-1.5 py-0.5 rounded bg-white/5 border border-white/10 text-[10px] text-slate-300 hover:text-white hover:border-[#8B5CF6]/60">{s}</button>)}</div>}

                    </section>

                                            {ideaCards.map((c, i) => (

                                                    <b>{c.title || `Fikir ${i + 1}`}</b>

                                    </div>

                                    {(b.blocking || b.sceneMap || b.continuityManifest) && <details className="rounded-lg border border-white/10 px-2.5 py-1.5 text-[11px] text-slate-400"><summary className="cursor-pointer text-slate-300 font-semibold">Sahne Kitabı ayrıntıları</summary>

                                <div className="flex flex-col gap-2">
                                    <details open className="local-prompt"><summary>Master prompt · Göster / Gizle</summary><Area label="Master prompt (düzenlenebilir)" value={b.prompt} onChange={v => S.patchScene({ prompt: v })} rows={6} ph="'Sahneyi kur' ile otomatik yazılır; doğrudan da yazabilirsiniz…" /></details>
                                    <Verdict v={b.pre} title="Ön denetim" />
                                    {promptStale && <div role="status" className="stale-note"><span>Ayarlar veya senaryo, prompt derlendikten sonra değişti. Görsel eski ayarlarla üretilir.</span><ActBtn S={S} k="studio.compile" label="Yeniden derle" run={compile} tone="a" /></div>}
                                </div>
                                {S.library.length > 0 && (
                                    <div className="pt-2 border-t border-white/5 flex flex-col gap-2">
                                        <Inp label="Kütüphanede ara" value={libQ} onChange={setLibQ} ph="prompt veya başlık ara…" />
                                        <Sel label={`Prompt kütüphanesi (${filteredLib.length})`} value="" onChange={id => { const l = filteredLib.find(x => String(x.id) === id); if (l) S.patchScene({ prompt: l.prompt }); }} list={[{ id: "", tr: "Kayıtlı prompt yükle…" }, ...filteredLib.map(l => ({ id: String(l.id), tr: `${l.time} · ${l.title}` }))]} />
                                    </div>
                                )}
                            </Box>
                        </div>

                        <div className="v2110-stage min-w-0 flex flex-col gap-3">
                            <Box title="3 · Görsel çalışma alanı" right={<ActBtn S={S} k="studio.render" label={`Master görseli üret (${eff})`} run={render} disabled={!b.prompt.trim()} />} className="flex-1">
                                <div className="cinema-preview-stage">
                                    <div className="cinema-preview-meta items-center">
                                        <div className="flex items-center gap-2 flex-wrap">
                                            <span>MASTER FRAME / {b.ratio === 'any' ? `OTOMATİK (${eff})` : eff}</span>
                                            <select
                                                aria-label="Hızlı En-Boy Oranı Seçimi"
                                                value={b.ratio || 'any'}
                                                onChange={(e) => handleRatioChange(e.target.value)}
                                                className="bg-[#141824] border border-white/15 rounded px-1.5 py-0.5 text-[10px] text-[#C4B5FD] font-semibold cursor-pointer"
                                            >
                                                {ASPECT_RATIOS.map(r => (
                                                    <option key={r.id} value={r.id}>{r.id === 'any' ? `Otomatik (${eff})` : r.label}</option>
                                                ))}
                                            </select>
                                        </div>
                                        <span>{res ? '● ÜRETİM HAZIR' : '○ ÖNİZLEME BEKLENİYOR'}</span>
                                    </div>
                                    <div className="cinema-preview-canvas">
                                        {res ? (
                                            <img src={res.url} alt={res.name || 'Master sahne'} onClick={() => S.inspect([res], 0)} style={{ aspectRatio: cssRatio(res.ratio || eff) }} />
                                        ) : (
                                            <div className="cinema-empty-preview">
                                                <span className="cinema-empty-icon">▣</span>
                                                <strong>Master Görsel Önizlemesi</strong>
                                                <p>Master promptu derleyip görsel oluşturduğunda sonuç burada görüntülenir. Büyük açmak için görsele tıklayın.</p>
                                                <span className="cinema-ratio-tag">{eff} · DİNAMİK KADRAJ</span>
                                            </div>
                                        )}
                                    </div>
                                    {res && <p className="text-[11px] text-slate-400 py-2">Denetim ve görsel araçları için görsele tıklayın.</p>}
                                </div>
                            </Box>
                            <AngleMeter S={S} master={res} fallbackRatio={eff} />
                            <ModuleFilmstrip S={S} tab="studio" compact title="Studio · Üretim Şeridi" externalSelectedId={res?.id} onSelectAsset={(a) => setResId(a?.id || null)} />
                        </div>
                        {/* 3. Sütun: Referanstan sahne (harici prompt / görsel analizi) */}
                        <div className="v2110-side min-w-0 flex flex-col gap-3">
                            <Box
                                title="Referanstan sahne oluştur"
                            >
                                <div className="rounded-lg bg-black/30 border border-white/10 p-2 flex items-center justify-between gap-2">
                                    <label className="flex items-center gap-2 text-[11px] text-slate-200 cursor-pointer select-none">
                                        <input
                                            type="checkbox"
                                            className="accent-[#8B5CF6] rounded"
                                            checked={preserveExtWardrobe}
                                            onChange={e => setPreserveExtWardrobe(e.target.checked)}
                                        />
                                        <span>
                                            <b className="text-white">Kıyafet Koru:</b> Promptta ne varsa o giyilsin
                                        </span>
                                    </label>
                                    <span className="text-[10px] text-slate-400 shrink-0">
                                        {preserveExtWardrobe ? '✓ Aktif' : 'Pasif'}
                                    </span>
                                </div>

                                {(
                                    <>
                                        <details open className="local-prompt"><summary>Kaynak prompt · Göster / Gizle</summary><Area label="Harici veya görselden çıkarılan prompt" value={ext} onChange={setExt} rows={3} /></details>
                                        <div className="flex flex-wrap gap-2">
                                            <Btn tone="g" disabled={!ext.trim()} onClick={applyExtDirectly}>Olduğu gibi kullan</Btn>
                                            <ActBtn S={S} k="studio.ext" label="Denetle ve kadroya uyarla" run={adaptExt} disabled={!ext.trim()} tone="g" />
                                            <ActBtn S={S} k="studio.scn" label="Promptan senaryo çıkar" run={scnFromPrompt} tone="g" />
                                        </div>
                                    </>
                                )}
                                {(
                                    <div className="flex flex-col gap-2">
                                        <div
                                            onClick={() => extFileRef.current?.click()}
                                            onDragOver={e => e.preventDefault()}
                                            onDrop={e => { e.preventDefault(); const f = e.dataTransfer.files?.[0]; if (f) handleExtFile(f); }}
                                            className="relative rounded-xl border border-dashed border-white/20 hover:border-[#8B5CF6]/60 bg-black/40 p-2.5 flex flex-col items-center justify-center cursor-pointer transition-colors min-h-[80px]"
                                        >
                                            {extImgPreview ? (
                                                <div className="flex items-center gap-3 w-full">
                                                    <img src={extImgPreview} alt="Referans" className="w-12 h-12 object-cover rounded-lg border border-white/10 shrink-0" />
                                                    <div className="flex-1 min-w-0 text-left">
                                                        <span className="text-[11px] font-semibold text-slate-200 block truncate">Görsel Seçildi</span>
                                                        <span className="text-[10px] text-slate-400 block mt-0.5">Değiştirmek için tıkla veya sürükle</span>
                                                    </div>
                                                </div>
                                            ) : (
                                                <div className="text-center">
                                                    <span className="text-[11px] font-semibold text-slate-300 block">Görsel Yükle veya Sürükle</span>
                                                    <span className="text-[9.5px] text-slate-500 block mt-0.5">AI stil, kıyafet ve ışık promptunu çıkarır</span>
                                                </div>
                                            )}
                                            <input ref={extFileRef} type="file" accept="image/*" className="hidden" onChange={e => { handleExtFile(e.target.files?.[0]); e.target.value = ''; }} />
                                        </div>
                                        <div className="flex flex-wrap items-center gap-2">
                                            <ActBtn S={S} k="studio.analyze" label="Görseli Analiz Et & Prompt Çıkar" run={analyzeExtImage} disabled={!extImgData} />
                                            <Btn tone="g" disabled={!extImgPreview} onClick={() => {setExtImgPreview(null);setExtImgData(null);}}>Referansı kaldır</Btn>
                                        </div>
                                    </div>
                                )}
                            </Box>
                        </div>

                    </div>
                </div>
            );
        };

        const LAB_PROTECT = [
            ['identity', 'Yüz ve kimlik', 'face identity, facial features, skin tone, hair and body proportions'],
            ['outfit', 'Kıyafet', 'exact outfit, fabrics, colors, accessories and props'],
            ['env', 'Mekân', 'background environment, location, objects and time of day'],
            ['framing', 'Kadraj', 'camera framing, angle, lens perspective and subject pose']
        ];
        const LabTab = ({ S }) => {
            const [modeRaw, setMode] = usePersist('lab.mode', 'edit');
            const mode = modeRaw === 'expand' ? 'expand' : 'edit';
            const [prompt, setPrompt] = usePersist('lab.prompt', '');
            const [aspect, setAspect] = usePersist('lab.aspect', 'any');
            const [charId, setCharId] = usePersist('lab.char', '');
            const [seed, setSeed] = usePersist('lab.seed', '');
            const [magic, setMagic] = usePersist('lab.magic', MAGIC_LIGHTS[0].id);
            const [lightOn, setLightOn] = usePersist('lab.lightOn.v38', modeRaw === 'light');
            const [lt, setLt] = usePersist('lab.lt', 'any');
            const [ls, setLs] = usePersist('lab.ls', 'any');
            const [protect, setProtect] = usePersist('lab.protect.v38', { identity: true, outfit: true, env: false, framing: true });
            const [recipes, setRecipes] = usePersist('lab.recipes.v38', []);
            const [refId, setRefId] = useState(null);
            const [afterId, setAfterId] = useState(null);
            const [view, setView] = useState(0);
            const [note, setNote] = useState('');
            const [analysis, setAnalysis] = useState('');
            const [libraryOpen, setLibraryOpen] = useState(false);
            const fileRef = useRef(null);
            const rail = useRail(S, 'lab', 'lab');

            const ref = S.A(refId), after = S.A(afterId), shown = after && view === 1 ? after : ref;
            const LAB_QUICK_EDITS = [
                { label: 'Arka planı değiştir', text: 'Change only the background environment to: [describe new background]. Preserve the original subject identity, face, hair, body, pose, wardrobe and camera framing.' },
                { label: 'Işığı yumuşat', text: 'Soften the lighting and harsh shadows with natural diffused illumination. Preserve identity, outfit, pose, background and natural skin texture.' },
                { label: 'Kıyafet dokusu ekle', text: 'Enhance the realistic material texture and fine fabric detail of the existing outfit. Preserve its exact color, cut, logos and overall appearance.' },
                { label: 'Editoryal kontrast artır', text: 'Apply tasteful premium editorial contrast and refined tonal separation. Preserve realistic skin tones, facial identity, clothing and composition.' }
            ];
            const MODES = [
                ['edit', '✎ Düzenle', "Komutla rötuş, hazır ışık ve AI önerisi (Director's Cut)"],
                ['expand', '⤢ Genişlet', 'Kadrajı yeni orana büyüt (outpaint)']
            ];
            const light = MAGIC_LIGHTS.find((x) => x.id === magic) || MAGIC_LIGHTS[0];
            const protectText = (keys = LAB_PROTECT.map(x => x[0])) => {
                const on = LAB_PROTECT.filter(([k]) => protect[k] && keys.includes(k)).map(x => x[2]);
                return on.length ? `PRESERVE EXACTLY: ${on.join('; ')}.` : '';
            };
            const pick = (id) => { if(S.editSession && id !== S.editSession.sourceId){S.notify('Kaynağı değiştirmek için mevcut düzenlemeyi uygulayın veya vazgeçin.','error');return;}setRefId(id); setAfterId(null); setView(0); setNote(''); setAnalysis(''); };
            const d = useDrop(S, pick);

            useEffect(() => {
                const p = S.pkt.lab; if (!p) return; const a = p.asset;
                pick(a.id);if(S.editSession)setMode('edit');setPrompt(p.instruction || '');
                S.clearPkt('lab');
            }, [S.pkt.lab?.n]);

            const suggest = () => S.run('lab.suggest', 'lab', "Director's Cut önerisi", async (sig) => {
                need(ref, 'Önce referans görsel yükleyin.');
                const r = await callGeminiWithImages(`ORIGINAL PROMPT: ${ref.prompt || ''}`, [await toB64(ref.url, sig)], true, SYS.cut, sig);
                setNote(r.critique_tr || ''); setPrompt(r.edit_prompt_en || '');
            });

            const analyzeRef = () => S.run('lab.analyze', 'lab', 'Görselden prompt çıkarılıyor', async (sig) => {
                need(ref, 'Önce bir görsel seçin.');
                const base = await toB64(ref.url, sig);
                setAnalysis(await callGemini('Analyze this image and reconstruct its production-ready master prompt.', false, SYS.analyze, sig, base.data, base.mimeType));
                S.notify('Görsel analiz edildi.');
            });

            const run = () => S.run('lab.run', 'lab', `Image Lab · ${mode === 'expand' ? 'genişlet' : lightOn && !prompt.trim() ? 'ışık' : 'düzenle'}`, async (sig) => {
                need(ref, 'Image Lab için önce sağdaki ekrandan bir görsel yükleyin veya seçin.');
                const base = await toB64(ref.url, sig);
                const ch = S.chars.find((c) => c.id === charId);
                const refs = ch ? await S.refsOf([ch], sig) : [];
                const effRatio = aspect !== 'any' ? aspect : (ref.ratio && ref.ratio !== 'any' ? ref.ratio : await detectClosestAspectRatio(ref.url));
                const lightExtra = `${opt(LIGHT_TIMES, lt) ? `, ${opt(LIGHT_TIMES, lt)}` : ''}${opt(LIGHT_STYLES, ls) ? `, ${opt(LIGHT_STYLES, ls)}` : ''}`;
                let fp = '', tag = 'EDIT', name = 'Lab · Düzenle';
                if (mode === 'expand') {
                    fp = `[STRICT OUTPAINTING TO ${effRatio}] Preserve original image center and subjects. ${prompt || 'Seamlessly extend the environment.'} ${protectText(['identity', 'outfit', 'env'])}`.trim();
                    tag = 'EXPAND'; name = 'Lab · Genişlet';
                } else if (lightOn && !prompt.trim()) {
                    fp = `[RELIGHT] ${light.prompt}${lightExtra}. Keep faces, identity, outfits, pose, composition and background unchanged; change only lighting and color grade.`;
                    tag = 'RELIGHT'; name = `Lab · Işık (${light.label})`;
                } else {
                    need(prompt, 'Düzenleme komutu girin, bir ışık seçin ya da “AI öneri” kullanın.');
                    const userEdit = [prompt.trim(), lightOn ? `Also relight the image: ${light.prompt}${lightExtra}.` : '', protectText()].filter(Boolean).join(' ');
                    fp = `[STRICT IMAGE EDIT LOCK] ${await callGemini(`USER EDIT: ${userEdit}\nTARGET CHARACTER: ${ch?.ad || 'general'}\nOUTFIT LOCK: ${ch ? (ref.wardrobe || ch.outfit) : 'Preserve only the people and clothing already visible in the uploaded image. Never add any new person.'}`, false, SYS.edit, sig, base.data, base.mimeType)}`;
                    if (lightOn) { tag = 'EDIT+LIGHT'; name = `Lab · Düzenle + ${light.label}`; }
                }
                const a = await S.produce({ sig, type: 'lab', name, tag, prompt: fp, ratio: effRatio, seed: normalizeSeed(seed) ?? undefined, base, refs, parentId: ref.id, audit: false, scenario: ref.scenario, extra: { wardrobe: ref.wardrobe, pendingEdit: !!S.editSession, editSourceId:S.editSession?.sourceId } });
                if (afterId) S.discardDraft(afterId);
                if (S.editSession) S.setEditSession(x => x ? { ...x, draftId: a.id } : x);
                setAfterId(a.id); setView(1);
                const af = split64(a.url);
                if (S.engine && af) {
                    try { S.patchAsset(a.id, { verdict: normV(await callGeminiWithImages(`EDIT INTENT: ${prompt || fp}`, [base, af], true, SYS.labCrit, sig)) }); } catch (e) { if (isAbort(e)) throw e; }
                }
                S.notify('İşlem tamamlandı — görsele tıklayarak önce / sonra arasında geçiş yapabilirsiniz.');
            });

            const saveRecipe = () => {
                const text = prompt.trim(); if (!text) return;
                const name = text.replace(/\s+/g, ' ').slice(0, 32) + (text.length > 32 ? '…' : '');
                setRecipes(r => [{ id: uid(), name, text, light: lightOn ? magic : '', protect }, ...r.filter(x => x.text !== text)].slice(0, 12));
                S.notify('Komut reçetelere kaydedildi.');
            };
            const applyRecipe = (r) => { setPrompt(r.text); if (r.light) { setMagic(r.light); setLightOn(true); } if (r.protect) setProtect(r.protect); setMode('edit'); };
            const runLabel = mode === 'expand' ? 'Genişlet' : lightOn && !prompt.trim() ? 'Işığı uygula' : 'Düzenlemeyi uygula';
            const isDraft = !!after?.pendingEdit;
            const stageLabel = after && view === 1 ? (isDraft ? 'TASLAK · onay bekliyor (tıkla → kaynak)' : 'SONUÇ (tıkla → kaynak)') : after ? 'KAYNAK (tıkla → sonuç)' : 'KAYNAK GÖRSEL';
            const railItems = [
                ['Kaynak', ref ? ref.name : 'Seçilmedi'],
                ['Mod', mode === 'expand' ? 'Genişlet' : lightOn ? `Düzenle + ${light.label}` : 'Düzenle'],
                ['Hedef', S.chars.find(c => c.id === charId)?.ad || 'Görseldeki kişiler'],
                ['Oran', aspect === 'any' ? 'Kaynakla aynı' : aspect],
                ['Koruma', LAB_PROTECT.filter(([k]) => protect[k]).map(x => x[1]).join(', ') || 'Yok'],
                ['Komut', prompt.trim() ? (prompt.length > 60 ? `${prompt.slice(0, 60)}…` : prompt) : '—']
            ];

            return (
                <div className="lab-v31 flex flex-col gap-3">
                    <div className={`cinema-reji-grid rail-grid ${rail.open ? '' : 'rail-closed'}`}>
                        {!rail.open ? (
                            <RailSummary rail={rail} title="Image Lab ayarları" items={railItems}>
                                <ActBtn S={S} k="lab.run" label={`${runLabel} (tekrar)`} run={run} disabled={!ref} tone="g" />
                                {S.editSession && <><Btn tone="a" disabled={!after||S.busy('lab.run')} onClick={()=>{if(S.commitEdit(after))setAfterId(null);}}>Uygula ve geri dön</Btn><Btn tone="g" disabled={S.busy('lab.run')} onClick={()=>{S.cancelEdit();setAfterId(null);}}>Vazgeç ve geri dön</Btn></>}
                            </RailSummary>
                        ) : (
                        <div className="cinema-reji-controls">
                            <RailBar rail={rail} />
                            <Box title="Image Lab · düzenleme">
                                <div className="seg-group" role="radiogroup" aria-label="Lab modu">
                                    {MODES.map(([id, t, desc]) => (
                                        <button key={id} type="button" role="radio" aria-checked={mode === id} title={desc} onClick={() => setMode(id)} className={mode === id ? 'is-on' : ''}>{t}</button>
                                    ))}
                                </div>
                                <p className="text-[11px] text-slate-400 -mt-1">{MODES.find(m => m[0] === mode)?.[2]}</p>

                                <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
                                    <Sel label="Hedef karakter" list={[{ id: '', tr: 'Genel / Görseldeki kişiler' }, ...S.chars.map(c => ({ id: c.id, tr: c.ad }))]} value={charId} onChange={setCharId} />
                                    <Sel label="En-boy oranı" list={ASPECT_RATIOS} value={aspect} onChange={setAspect} />
                                    <Inp label="Seed (isteğe bağlı)" value={seed} onChange={setSeed} />
                                </div>

                                {mode === 'edit' && (
                                    <>
                                        <div className="grid grid-cols-2 gap-2">
                                            {LAB_QUICK_EDITS.map(q => (
                                                <button type="button" key={q.label} onClick={() => setPrompt(q.text)} className="text-left rounded-xl border border-violet-500/25 bg-violet-500/[.07] hover:bg-violet-500/20 px-3 py-2 text-[11px] font-semibold text-violet-200">
                                                    ✦ {q.label}
                                                </button>
                                            ))}
                                        </div>
                                        <div className="flex flex-col gap-1.5">
                                            <span className="text-[11px] font-semibold text-slate-300">Hazır ışık <span className="font-normal text-slate-500">· komut boşsa yalnızca ışık değişir</span></span>
                                            <div className="flex flex-wrap gap-1.5">
                                                {MAGIC_LIGHTS.map(m => {
                                                    const Ico = m.icon, on = lightOn && magic === m.id;
                                                    return (
                                                        <button type="button" key={m.id} aria-pressed={on} onClick={() => { if (on) setLightOn(false); else { setMagic(m.id); setLightOn(true); } }} className={`chip ${on ? 'is-on' : ''}`}>
                                                            {Ico && <Ico />}{m.label}
                                                        </button>
                                                    );
                                                })}
                                            </div>
                                            {lightOn && (
                                                <div className="grid grid-cols-2 gap-2">
                                                    <Sel label="Işık zamanı" list={LIGHT_TIMES} value={lt} onChange={setLt} />
                                                    <Sel label="Işık stili" list={LIGHT_STYLES} value={ls} onChange={setLs} />
                                                </div>
                                            )}
                                        </div>
                                        <Area label="Düzenleme komutu" value={prompt} onChange={setPrompt} rows={4} ph="Örn: Arka planı gün batımı sahiline çevir" />
                                        <div className="flex flex-wrap gap-2">
                                            <ActBtn S={S} k="lab.suggest" label="AI öneri / Director's Cut" run={suggest} disabled={!ref} tone="g" />
                                            <Btn tone="g" disabled={!prompt.trim()} onClick={saveRecipe} title="Bu komutu tekrar kullanmak için kaydet">☆ Reçete olarak kaydet</Btn>
                                        </div>
                                        {note && <p className="text-xs text-slate-400">{note}</p>}
                                    </>
                                )}

                                {mode === 'expand' && <Area label="Genişletme komutu" value={prompt} onChange={setPrompt} rows={4} ph="Örn: Sağ tarafa deniz manzarası ekle" />}

                                <div className="flex flex-col gap-1.5">
                                    <span className="text-[11px] font-semibold text-slate-300">Koru</span>
                                    <div className="flex flex-wrap gap-1.5">
                                        {LAB_PROTECT.map(([k, label]) => (
                                            <button type="button" key={k} aria-pressed={!!protect[k]} onClick={() => setProtect(p => ({ ...p, [k]: !p[k] }))} className={`chip ${protect[k] ? 'is-on' : ''}`}>{protect[k] ? '✓ ' : ''}{label}</button>
                                        ))}
                                    </div>
                                </div>

                                {recipes.length > 0 && (
                                    <div className="flex flex-col gap-1.5">
                                        <span className="text-[11px] font-semibold text-slate-300">Reçeteler</span>
                                        <div className="flex flex-wrap gap-1.5">
                                            {recipes.map(r => (
                                                <span key={r.id} className="chip">
                                                    <button type="button" onClick={() => applyRecipe(r)} title={r.text}>{r.name}</button>
                                                    <button type="button" aria-label={`${r.name} reçetesini sil`} className="text-slate-500 hover:text-rose-300" onClick={() => setRecipes(x => x.filter(y => y.id !== r.id))}>×</button>
                                                </span>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                <div className="pt-2 border-t border-white/10 flex flex-wrap items-center gap-2">
                                    <ActBtn S={S} k="lab.run" label={runLabel} run={run} disabled={!ref} />
                                    {S.editSession ? <><Btn tone="a" disabled={!after||S.busy('lab.run')} onClick={()=>{if(S.commitEdit(after))setAfterId(null);}}>Uygula ve geri dön</Btn><Btn tone="g" disabled={S.busy('lab.run')} onClick={()=>{S.cancelEdit();setAfterId(null);}}>Vazgeç ve geri dön</Btn></> : after && <Btn tone="a" onClick={() => pick(after.id)}>Sonucu yeni kaynak yap</Btn>}
                                </div>
                            </Box>
                        </div>
                        )}

                        <div className="cinema-reji-master flex flex-col gap-3" {...d.props}>
                            <Box
                                title="Önizleme · önce / sonra"
                                right={
                                    <div className="flex flex-wrap items-center gap-1.5">
                                        <Btn tone="g" onClick={() => fileRef.current?.click()}>↑ Görsel yükle</Btn>
                                        <Btn tone="a" onClick={() => setLibraryOpen(true)}>▦ Kütüphaneden seç</Btn>
                                        {after && (
                                            <>
                                                <Btn tone={view === 0 ? 'a' : 'g'} onClick={() => setView(0)}>Kaynak</Btn>
                                                <Btn tone={view === 1 ? 'a' : 'g'} onClick={() => setView(1)}>{isDraft ? 'Taslak' : 'Sonuç'}</Btn>
                                            </>
                                        )}
                                    </div>
                                }
                            >
                                <input ref={fileRef} type="file" accept="image/*" className="hidden" onChange={async e => { const f = e.target.files?.[0]; if (f) { const up = await S.uploadFile(f); if (up) pick(up.id); } e.target.value = ''; }} />
                                {libraryOpen && <LibraryPicker S={S} onClose={() => setLibraryOpen(false)} onPick={pick} />}

                                {!ref ? (
                                    <div className={`v219-hero lab-stage relative rounded-xl overflow-hidden border border-white/10 bg-[#05070C] flex items-center justify-center p-3 ${d.over ? 'ring-2 ring-[#8B5CF6]' : ''}`}>
                                        <div className="relative w-full h-full max-w-[95%] max-h-[92%] rounded-xl border border-dashed border-[#8B5CF6]/30 bg-black/40 flex flex-col items-center justify-center text-center p-4">
                                            <div className="w-8 h-8 rounded-full border border-white/10 flex items-center justify-center text-[#A78BFA] mb-2 bg-[#8B5CF6]/5"><Icons.Clapperboard /></div>
                                            <span className="text-[12px] font-semibold text-slate-300">Düzenlenecek görseli seçin</span>
                                            <span className="text-[10px] text-slate-500 mt-1 max-w-sm">Görsel yükleyin, kütüphaneden seçin veya film şeridinden sürükleyin.</span>
                                            <div className="flex flex-wrap justify-center gap-2 mt-3">
                                                <Btn tone="g" onClick={() => fileRef.current?.click()}>Görsel yükle</Btn>
                                                <Btn tone="a" onClick={() => setLibraryOpen(true)}>Kütüphaneden seç</Btn>
                                            </div>
                                        </div>
                                    </div>
                                ) : (
                                    <div
                                        className="v219-hero lab-stage relative rounded-xl border border-white/10 bg-[#070b16] overflow-hidden flex items-center justify-center p-3 cursor-pointer select-none"
                                        onClick={() => after ? setView(v => v === 0 ? 1 : 0) : S.inspect([ref], 0)}
                                    >
                                        <img src={shown.url} alt={view === 1 && after ? 'Sonuç' : 'Kaynak'} className="max-w-full max-h-full object-contain rounded-lg" />
                                        <span className={`absolute left-3 top-3 text-[10px] font-bold tracking-wider px-2.5 py-1 rounded text-white shadow ${after && view === 1 ? (isDraft ? 'bg-amber-600/90' : 'bg-violet-600/90') : 'bg-black/75'}`}>{stageLabel}</span>
                                        <button title="Büyüt" onClick={e => { e.stopPropagation(); S.inspect(after ? [ref, after] : [ref], after && view === 1 ? 1 : 0); }} className="absolute top-3 right-3 p-1.5 rounded-lg bg-black/60 text-white hover:bg-black/80">
                                            <Icons.Maximize />
                                        </button>
                                    </div>
                                )}

                                {shown && (
                                    <div className="pt-2 border-t border-white/10 flex flex-col gap-2">
                                        <AssetActions a={shown} S={S} plain={!after || view === 0} extra={<>
                                            <Btn tone="g" onClick={() => { setRefId(null); setAfterId(null); setView(0); }}>Temizle</Btn>
                                            <ActBtn S={S} k="lab.analyze" label="⌕ Görselden prompt çıkar" run={analyzeRef} disabled={!ref} tone="g" />
                                        </>} />
                                        {analysis && (
                                            <>
                                                <Area label="Çıkarılan master prompt" value={analysis} onChange={setAnalysis} rows={4} />
                                                <div className="flex flex-wrap gap-2">
                                                    <Btn tone="g" onClick={() => S.copy(analysis)}>Kopyala</Btn>
                                                    <Btn tone="g" onClick={() => { S.patchScene({ prompt: analysis }); S.setTab('studio'); S.notify('Prompt Studio’ya aktarıldı.'); }}>Studio'ya aktar</Btn>
                                                </div>
                                            </>
                                        )}
                                    </div>
                                )}
                            </Box>
                            <ModuleFilmstrip S={S} tab="lab" compact title="Image Lab · geçmiş ve varyasyonlar" externalSelectedId={shown?.id} onSelectAsset={(a) => a && pick(a.id)} />
                        </div>
                    </div>
                </div>
            );
        };
