            const writeSegment = async (g, sig, spoken) => {
                const m = mode, sl = slotsFor(g, m), clip = clipOf(g);
                if (m.kind === 'first' || m.kind === 'firstlast') need(sl[0]?.a?.url, `Parça ${g.k + 1}: ilk kare yok. Kareleri üretin ya da seçin.`);
                if (m.kind !== 'ref' && sl.some(x => isSheetA(x.a))) throw new Error('Pafta görseli kare kutusuna verilemez; tekil kare seçin. Pafta yalnızca referans / içerik öğesi modlarında kullanılabilir.');
                const imgs = [], roles = [];
                let ingN = 0;
                const add = async (a, role) => { if (!a?.url) return; ingN++; if (imgs.length < 12) { imgs.push(await toB64(a.url, sig)); roles.push(`Image ${ingN} = ${role}`); } else roles.push(`Image ${ingN} = ${role} (uploaded to the tool, not shown to you)`); };
                if (m.kind === 'text') await add(ref, 'LOOK REFERENCE ONLY: the video tool will NOT receive this image, describe faces, hair, outfit and set in words');
                for (const x of sl) {
                    if (!x.a) continue;
                    const role = m.kind === 'firstlast' || m.kind === 'first' ? (x.key === 'last' ? 'LAST FRAME: the clip must end exactly on this image' : 'FIRST FRAME: the clip starts exactly on this image')
                        : m.kind === 'keyframes' ? `KEYFRAME at ${x.at.toFixed(1)}s` : x.sheet ? 'STORYBOARD SHEET (reference only: story order, identity, outfit, props and set; it will be uploaded as an ingredient, so the prompt must say it is a reference and the video must NEVER show this sheet, its grid, panels, borders, numbers or captions)' : x.cast ? `CHARACTER IDENTITY ${x.cast.identity ? 'SHEET' : 'PHOTO'} of ${x.cast.name}: face, hair, skin, body and outfit must match it exactly in every shot; it is a reference only, never show its layout, panels or white background` : `REFERENCE "${x.role}" (identity, outfit or set; never show the reference sheet itself)`;
                    await add(x.a, role);
                }
                const beats = g.idx.map(i => { const s = plan[i]; return `[${fmtSec(Math.max(0, s.start_sec - g.start))}-${fmtSec(Math.min(clip, s.end_sec - g.start))}] ${s.shot_label}: ${s.action || s.beat_short} | camera: ${s.camera_note || ''}${s.transition_in === 'cut' ? ' | starts with a cut' : ''}${s.state_en ? ` | STATE after: ${s.state_en}` : ''}`; }).join('\n');
                const nextG = segs[g.k + 1];
                const input = `STORY OF THE SCENE: ${scenario || S.bible.scenario || ''}\n${S.bible.prevSummary ? `PREVIOUS SCENE: ${S.bible.prevSummary}\n` : ''}PART ${g.k + 1} OF ${segs.length}: covers scene seconds ${fmtSec(g.start)}-${fmtSec(g.end)}; the generated clip is EXACTLY ${clip} seconds.\nSHOTS IN THIS PART (times relative to the clip):\n${beats || '(build the beats from the story)'}\n${nextG ? `NEXT PART STARTS WITH: ${plan[nextG.idx[0]]?.action || plan[nextG.idx[0]]?.beat_short || ''} (transition: ${g.toNext === 'kesme' ? 'hard cut' : 'continuous, the last frame of this clip is the first frame of the next'})\n` : 'THIS IS THE LAST PART OF THE SCENE.\n'}DIALOGUE ALREADY SPOKEN IN EARLIER PARTS: ${spoken.length ? spoken.join(' / ') : 'none'}\nTARGET TOOL: ${plat.name} (${plat.model})\nMODE: ${m.tr} — ${m.kind === 'text' ? 'text-to-video, fully self-contained' : m.kind === 'ref' ? 'reference images keep identity, outfit and set; the prompt stages the action' : m.kind === 'keyframes' ? 'keyframes are pinned at the given times; describe the motion between them' : 'start (and end) frames are given; describe only the motion, camera, dialogue and sound between them'}\nASPECT RATIO: ${platRatio}\nAUDIO: ${audio ? 'on' : 'off (no sound, no dialogue)'}${plat.multishot ? `\nMULTI-SHOT: ${multishot ? 'ON' : 'OFF'}` : ''}\nDIALOGUE LANGUAGE: ${!audio || vDialog === 'none' ? 'no spoken dialogue' : vDialog === 'en' ? 'ENGLISH' : 'TURKISH'}\nCAST: ${S.cast.map(c => `${c.ad} (${c.sex}): ${cleanCastDna(c.dna)}`).join(' | ')}\nOUTFIT LOCK: ${firstOf(g)?.wardrobe || ref?.wardrobe || S.lockText()}\nPRODUCTION STATE: ${S.prodCtx() || 'none'}\n${audioCtx()}\nDIRECTOR NOTE: ${vNote.trim() || 'none'}${sl.some(x => x.sheet) ? '\nSTORYBOARD SHEET IN INGREDIENTS: it only tells you the order, staging and set; write the prompt as one continuous full-frame live-action sequence and DO NOT mention the storyboard in the prompt; put split screen, collage, grid, panels, on-screen text in the negative.' : ''}${m.kind === 'ref' && sl.some(x => x.sheet) && sl.some(x => x.cast) ? '\nREFERENCE STRATEGY: the storyboard sheet drives story order, staging, camera and set; the character identity sheets drive how each character looks. Where the storyboard drawing and an identity sheet disagree about a face, hair or outfit, the identity sheet wins.' : ''}${m.kind === 'ref' ? `\nINGREDIENT ORDER ON THE TOOL (same numbers as IMAGES): ${sl.filter(x => x.a?.url).map((x, n) => `${n + 1}=${x.sheet ? 'storyboard' : x.cast ? x.cast.name : x.role}`).join(', ')}. Reference style for this tool: ${plat.refStyle || 'name each character with two or three visible traits'}` : ''}\nIMAGES: ${roles.join(' | ') || 'none'}`;
                const sys = `You are a senior AI video director writing prompts for a specific video generation tool. Write ONE production-ready English prompt for this part of the scene.\nRules:\n- Obey the MODE and the exact clip duration. Cover 00:00 to the end of the clip with timecoded beats and no gaps; for each beat give framing, camera move, action and expression.\n- Language: prompt_en is entirely in English. Only the words spoken inside quotes use the requested dialogue language; the speaker tag and tone stay English, e.g. LENA (sadly): "Bitmeyecek gibi...". Never put Turkish words outside the quotes.
- The image numbers in IMAGES are only for you. Never write "Image 1", "Image 2", "first frame", "last frame", "the scene begins with" or "ending on" an image, unless the reference style for this tool below explicitly asks for @Image numbers; the tool already holds the frames, so describe only what happens on screen.
- If spoken dialogue is allowed, write short natural lines as SPEAKER (tone): "line", about 2-3 words per second with pauses, never more speech than the clip allows, never repeating lines already spoken; continue the conversation naturally.\n- Add an Audio: line (ambience, foley, music mood) unless audio is off.\n- Continuity lock: same identity, outfit, props, lighting, set geography and character positions; new framings come from moving the camera, never from relocating characters.
- Story logic: follow the STATE of each shot. A prop exists only after it is picked up or handed over on screen and stays until it is put down on screen; a character changes place (in water, on the edge, out of the pool, standing, sitting) only through a visible action with enough time; wet stays wet. If the shot list contains a jump, bridge it with a short visible action instead of teleporting.

- ${SAFE_WORDING}\n- Match the tool's prompt style: ${plat.style}\nReturn ONLY JSON: {"title_tr":"short Turkish title","prompt_en":"the full prompt","negative_en":"comma separated negative prompt","beats":[{"t":"00:00-00:03","action_tr":"short Turkish summary"}],"dialogue":[{"t":"00:01","speaker":"name","line":"spoken line"}]}`;

                setVRes(v => { const pr = v[plat.id] || { segs: {} }; return { ...v, [plat.id]: { ...pr, mode: m.id, at: Date.now(), n: segs.length, segs: { ...(pr.segs || {}), [g.k]: rec } } }; });

                const p = String(r?.prompt_en || '').trim(); need(p, 'AI yeni prompt döndürmedi.');

            const sceneRecs = Object.values(resNow.segs || {}).filter(r => r.n === segs.length).sort((a, b) => a.k - b.k);
            /* V42.1 · ZIP'e ekrandaki tüm görseller girer: aktif moddaki kutular/içerik öğeleri + prompt yazılırken kullanılanlar */
            const slotItem = (x) => ({ id: x.a.id, role: x.role, kind: x.sheet ? 'pafta' : x.cast ? 'identity' : (x.key || 'ref'), name: x.cast ? x.cast.name : '' });

                if (recs.length > 1) files.push({ name: `SAHNE_${sceneIdx + 1}_tum_promptlar.txt`, data: recs.map(x => promptBlock(x, sceneIdx + 1)).join('\n\n\n') });

            const exportScene = (fmt) => { if (!sceneRecs.length) return; const blob = new Blob([fmt === 'json' ? JSON.stringify(sceneRecs, null, 2) : sceneRecs.map(x => promptBlock(x, sceneIdx + 1)).join('\n\n\n')], { type: fmt === 'json' ? 'application/json' : 'text/plain;charset=utf-8' }); const u = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = u; a.download = `AiFotofilm_${plat.id}_sahne_${Date.now()}.${fmt}`; a.click(); setTimeout(() => URL.revokeObjectURL(u), 2000); };

            /* ---------- Sahneler: proje akışı, devam sahnesi, hikâyeyi sahnelere bölme ---------- */
            const sceneIdx = Math.max(0, S.scenes.findIndex(x => x.id === S.activeId));
            const sceneInfo = (s) => {
                const pl = scopedGet('story.plan', s.id, []), sc = Number(scopedGet('story.sec.v41', s.id, '')) || Number(s.sceneSec) || plat.max;
                const cl = scopedGet('story.cells.v38', s.id, {}), ou = scopedGet('story.out.v233', s.id, {});
                const frames = pl.filter((p, i) => S.A(cl[p?.cid || `i${i}`]?.startId) || S.A(ou[i])).length;
                const vr = scopedGet('vid.res.v41', s.id, {})[plat.id]?.segs || {};
                return { sec: sc, shots: pl.length, frames, prompts: Object.keys(vr).length };
            };
            const totalProject = S.scenes.reduce((acc, s) => acc + sceneInfo(s).sec, 0);
            const addContinuation = () => S.run('story.next', 'story', 'Devam sahnesi öneriliyor', async (sig) => {
                const b = S.bible;
                const history = S.scenes.slice(0, sceneIdx + 1).map((s, i) => `${i + 1}. ${s.title}: ${s.scenario || ''}`).join('\n');
                const beats = plan.map(s => `${s.timecode} ${s.action || s.beat_short}`).join('\n');
                const r = await callGemini(`PROJECT SCENES SO FAR:\n${history}\nCURRENT SCENE BEATS:\n${beats || '(no plan)'}\nCAST: ${S.cast.map(c => `${c.ad} (${c.sex})`).join(', ')}\nPRODUCTION STATE: ${S.prodCtx() || 'none'}\nTARGET LENGTH: about ${sec} seconds (tool limit ${plat.max}s per clip)`, true, 'You are a film story editor. Write the NEXT scene that continues this story naturally from where the current scene ends. Keep the same characters, outfits and world unless the story needs a change. Decide whether it continues the same moment ("devam") or jumps after a cut ("kesme"). Return ONLY JSON: {"title_tr":"short Turkish scene title","story_tr":"2-4 Turkish sentences describing what happens in the next scene","transition":"devam or kesme","seconds":number}', sig);
                chk(sig);
                const tr = r?.transition === 'kesme' ? 'kesme' : 'devam';
                const lastId = startOf(Math.max(0, plan.length - 1))?.id || sceneLastFrameId(b.id) || null;
                const secs = Math.max(plat.min || 3, Math.min(60, Math.round(Number(r?.seconds) || sec)));
                S.insertScenes([{ ...sceneInherit(b), title: String(r?.title_tr || `${b.title} · devam`).slice(0, 60), scenario: String(r?.story_tr || ''), prevSceneId: b.id, transition: tr, sceneSec: secs, handoffAssetId: tr === 'devam' ? lastId : null, prevSummary: `${b.title}: ${b.scenario || ''}`.slice(0, 700) }], b.id);
                S.notify('Devam sahnesi açıldı. Hikâyesini AI önerdi; düzenleyip planı kurabilirsin.');

            const splitJob = () => S.run('story.split', 'story', 'Hikâye sahnelere bölünüyor', async (sig) => {
                const story = (splitStory || scenario).trim(); need(story, 'Bölünecek hikâyeyi yazın.');
                const total = Math.max(5, Number(splitTotal) || 40), len = Math.max(plat.min || 3, Number(splitLen) || plat.max);

                chk(sig);
                const rows = (Array.isArray(r?.scenes) ? r.scenes : []).slice(0, 20).map((x, i) => ({ id: uid(), title: String(x.title_tr || `Sahne ${i + 1}`).slice(0, 60), story: String(x.story_tr || ''), seconds: String(Math.max(plat.min || 3, Math.min(60, Math.round(Number(x.seconds) || len)))), transition: i === 0 ? 'açılış' : (x.transition === 'kesme' ? 'kesme' : 'devam') }));

            return (

            const pump = () => {

            const run = (key, jtab, label, fn) => new Promise(resolve => {
                const id = uid(), ctl = new AbortController();
                const queuedAt = performance.now();
                let startedAt = null, finished = false, lastStage = 'Sırada';
                Q.current.ctl[id] = ctl;
                setJobs(j => [...j, { id, key, tab: jtab, label, status: 'queued', progress: 0, text: '', queuedAt: Date.now() }]);

                        id, module: jtab, operation: label, status,

                        chk(ctl.signal);

                            if (!ctl.signal.aborted) {
                                if (text) lastStage = String(text).slice(0, 120);

                        });

                        }

                    } finally {
                        Q.current.running = Math.max(0, Q.current.running - 1);

                    const moduleKeys = [];
                    for (let i = 0; i < localStorage.length; i++) {
                        const k = localStorage.key(i);
                        if (k?.startsWith(PFX) && /^(video|story|inf|reji)\./.test(k.slice(PFX.length))) moduleKeys.push(k);
                    }
                    moduleKeys.forEach(k => localStorage.removeItem(k));
                    for (const [k, v] of Object.entries(d.workspace || {})) if (/^(video|story|inf|reji)\./.test(k)) SAVE(PFX + k, v);
                    setEpoch(e => e + 1); setPkt({}); setVideoImport(null); setInsp(null);
                    setScenes(d.scenes.map(normalizeScene)); setActiveId(d.scenes.some(x => x.id === d.activeId) ? d.activeId : d.scenes[0].id);
                    if (d.assets) setAssets(d.assets); if (d.library) setLibrary(d.library);
                    notify('Proje içe aktarıldı.');
                } catch (e) { notify(`İçe aktarma hatası: ${e.message}`, 'error'); }
            };

            const lineage = (a) => { const out = [a]; let c = a, n = 0; while (c?.parentId && n++ < 8) { const p = A(c.parentId); if (!p || out.includes(p)) break; out.unshift(p); c = p; } return out; };
            const prodCtx = () => {
                const bl = bible.blocking || {}, sm = bible.sceneMap || {}, m = bible.continuityManifest || {};
                const cs = (bl.characters || []).map((x) => `${String(x.id || '').toUpperCase()}: ${[x.frame_position, x.depth, x.body_orientation, x.eyeline && `eyeline ${x.eyeline}`, x.action].filter(Boolean).join(', ')}`).filter(Boolean);
                const props = (sm.props || []).map((x) => `${x.name}${x.position ? ` at ${x.position}` : ''}${x.owner ? ` (${x.owner})` : ''}`).filter(Boolean).join(', ');
                const anchors = (sm.environment_anchors || []).map((x) => `${x.name}${x.position ? ` at ${x.position}` : ''}`).filter(Boolean).join(', ');
                const blk = [...cs, bl.action_axis && `action axis ${bl.action_axis}`, bl.camera_side && `camera side ${bl.camera_side}`, bl.screen_direction && `screen direction ${bl.screen_direction}`].filter(Boolean).join('; ');
                return [blk && `Blocking: ${blk}`, props && `Props: ${props}`, anchors && `Environment anchors: ${anchors}`, sm.light_direction && `Light direction: ${sm.light_direction}`, m.time && `Time: ${m.time}`, m.weather && `Weather: ${m.weather}`, m.lighting && `Lighting: ${m.lighting}`].filter(Boolean).join('. ');
            };

            const wipeKeys = (all) => {
                try {
                    const ks = [], keep = ['scenes', 'active', 'assets', 'lib'].map(n => PFX + n);
                    for (let i = 0; i < localStorage.length; i++) {
                        const k = localStorage.key(i);
                        if (!k || k === 'ai_fotofilm_gemini_api_key' || k.startsWith(MODEL_PFX)) continue;
                        if (all ? (k.startsWith(PFX) || k.startsWith('ai_fotofilm_')) : (k.startsWith(PFX) && !keep.includes(k))) ks.push(k);
                    }
                    ks.forEach(k => localStorage.removeItem(k));
                } catch (e) { }
            };
            const resetUI = () => {
                wipeKeys(false);
                setLink({}); setEngine(true); setAutoFix(false); setShowP(false); setDockOpen(true); setInsp(null); setCastOpen(false); setSettingsOpen(false); setPkt({});
                setTab('studio'); setEpoch(e => e + 1); notify('Arayüz varsayılana sıfırlandı; projeniz korundu.');
            };
            const resetAll = () => {
                setEditSession(null); stopAll(); setJobs([]); clearTimeout(noteT.current); setNote(null);
                wipeKeys(true);
                const sc = newScene('Sahne 1');
                setChars(INITIAL_CHARACTERS); setSel([INITIAL_CHARACTERS[0].id]); setProfiles({ ...DEFAULT_INFLUENCER_PROFILES }); setTrends('');
                setScenes([sc]); setActiveId(sc.id); setAssets([]); setLibrary([]); try { idbSet(ASSET_KEY, []).catch(() => { }); } catch (e) { } resetUI(); notify('Proje tamamen sıfırlandı.');
            };

            const openInspect = (items, start = 0) => {
                const valid = (Array.isArray(items) ? items : [items]).filter(Boolean);
                if (!valid.length) return;
                if (valid.length === 1) {
                    const target = valid[0];
                    const siblings = assetNow.current.filter(a => !a.pendingEdit && (
                        target.type === 'storyboard'
                            ? a.type === 'storyboard'
                            : (a.type === target.type && a.sceneId === target.sceneId)
                    ));
                    if (siblings.length > 1) {
                        const map = new Map();
                        siblings.forEach(a => map.set(a.id, a));
                        if (!map.has(target.id)) map.set(target.id, target);
                        const merged = Array.from(map.values());
                        const idx = Math.max(0, merged.findIndex(a => a.id === target.id));
                        setInsp({ items: merged, start: idx });
                        return;
                    }
                }
                setInsp({ items: valid, start: Math.max(0, Math.min(start, valid.length - 1)) });
            };

            const S = {
                tab, setTab, scanOrphans, cleanupOrphans, catalogue, catalogueStatus, loadCatalogue, applyCatalogue, galleryIndex, setGalleryIndex, exportArchive,
                storyWorkspace, setStoryWorkspace, editSession, setEditSession, openLab, commitEdit, cancelEdit, replaceAssetInPlace, regenerateAsset, undoAsset, redoAsset, chars, setChars, sel, setSel, cast, profiles, setProfiles, trends, setTrends, scenes, bible, activeId: aid, setActiveId, patchScene, newSceneWith, insertScenes, delScene,
                assets, A, patchAsset, delAsset, discardDraft: (id) => setAssets(xs => xs.filter(a => a.id !== id)), library, pushLib, seeds, link, setLink, engine, setEngine, autoFix, setAutoFix, showP, setShowP, dockOpen, setDockOpen, setSettingsOpen, models, setModel,
                lineage, prodCtx, resetUI, resetAll, jobs, pkt, videoImport, setVideoImport, setVideoImportIds: setVideoImport, clearPkt: (t) => setPkt((p) => { const n = { ...p }; delete n[t]; return n; }),
                run, cancel, busy, jobOf, stopKey, stopAll, perfLog, clearPerf: () => { perfRef.current = []; setPerfLog([]); }, notify, copy, castOf, lockText, castInfo, castPayload, refsOf, auditPrompt, batchAudit, produce, auditAsset, repairAsset,
                transfer, loadHere, uploadFile, addLocalAsset: (p) => addAsset(makeAsset(p)), inspect: openInspect, registerViewerAction: (id, action) => {viewerActions.current[id]=action;return ()=>{if(viewerActions.current[id]===action)delete viewerActions.current[id];};}, viewerAction: a => viewerActions.current[a?.id], setCastOpen, exportProject, importProject, downloadMemory, importMemory
            };

            const VIEW = MEMO_VIEWS;

            return (
                <div className="af-v234-app min-h-screen bg-[#090A0D] bg-[radial-gradient(ellipse_at_top,rgba(139,92,246,0.08),transparent_60%)] text-slate-200 font-sans flex flex-col selection:bg-[#8B5CF6]/30">
                    <div className="af-v234-top sticky top-0 z-50 shadow-[0_8px_24px_rgba(0,0,0,0.35)]">
                        <header className="af-v234-header bg-[#0D0F14]/90 backdrop-blur-xl border-b border-white/5">
                            <div className="af-v234-header-inner max-w-[1900px] mx-auto px-3 py-1.5 flex flex-wrap items-center gap-x-3 gap-y-1.5">
                                <div className="af-v234-brand font-extrabold text-white text-[15px] flex items-center gap-2">
                                    <span className="af-v234-logo text-[#A78BFA]"><Icons.Clapperboard /></span>
                                    AiFotofilm
                                    <span className="af-v234-version text-[10px] font-bold text-[#A78BFA] border border-[#8B5CF6]/30 bg-[#8B5CF6]/10 px-1.5 py-0.5 rounded">V{APP_VERSION}</span>
                                    {saveState.status === 'saving' && (
                                        <span className="inline-flex items-center gap-1.5 px-2 py-0.5 rounded text-[10px] font-medium border border-violet-500/40 bg-violet-500/10 text-violet-300">
                                            <span className="w-1.5 h-1.5 rounded-full bg-violet-400 animate-ping" />
                                            Kaydediliyor…
                                        </span>
                                    )}
                                    {saveState.status === 'saved' && (
                                        <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded text-[10px] font-medium border border-emerald-500/30 bg-emerald-500/10 text-emerald-300">
                                            <span className="text-[9px]">✓</span>
                                            Kaydedildi
                                        </span>
                                    )}
                                    {saveState.status === 'error' && (
                                        <button
                                            type="button"
                                            title={saveState.error?.message ? `Hata: ${saveState.error.message} (Yeniden denemek için tıklayın)` : 'Kayıt başarısız. Yeniden denemek için tıklayın.'}
                                            onClick={() => idbSaveQueue.enqueue(assets.filter(a => !a.pendingEdit), (st, er) => setSaveState({ status: st, error: er || null }))}
                                            className="inline-flex items-center gap-1 px-2 py-0.5 rounded text-[10px] font-medium border border-rose-500/40 bg-rose-500/15 text-rose-300 hover:bg-rose-500/25 transition-colors cursor-pointer"
                                        >
                                            <span className="font-bold">!</span>
                                            Kayıt başarısız
                                        </button>
                                    )}
                                </div>
                                <nav aria-label="Çalışma modülleri" className="af-tabs42">{TABS.map(([id, t]) => {
                                    const busyTab = jobs.some(j => isActive(j) && j.tab === id);
                                    const meta = (typeof TAB_META !== 'undefined' && TAB_META[id]) || ['', ''];
                                    return <button key={id} type="button" aria-current={tab === id ? "page" : undefined} onClick={() => setTab(id)} className={`af-tab42 ${tab === id ? "active" : ""}`}><span className="af-tab42-ico" aria-hidden="true">{meta[0]}</span><span className="af-tab42-txt"><b>{t}</b>{meta[1] && <small>{meta[1]}</small>}</span>{busyTab && <i className="af-tab42-busy" title="Çalışıyor" />}</button>;
                                })}</nav>
                                <div className="af-v234-actions ml-auto flex flex-wrap items-center gap-2 text-[11px] text-slate-300">
                                    <label className="flex items-center gap-1.5 cursor-pointer" title="Her üretimde prompt ön denetimi ve görsel denetimi"><input type="checkbox" className="accent-[#8B5CF6]" checked={engine} onChange={e => setEngine(e.target.checked)} />Tutarlılık motoru</label>
                                    <Btn tone="g" onClick={() => setResetModalOpen(true)} title="Sıfırlama seçenekleri: Arayüzü sıfırla veya tüm projeyi sil"><span className="inline-flex items-center gap-1"><Icons.RotateCcw />Sıfırla</span></Btn>
                                    <Btn tone="g" onClick={() => setGlobalLibraryOpen(true)}>▦ Ortak Kütüphane</Btn>
                                    <Btn tone="a" onClick={() => setSettingsOpen(true)}>⚙ Ayarlar</Btn>
                                </div>
                            </div>
                        </header>
                        <ProjectBar S={S} />
                        {storageDegraded && (
                            <div role="alert" className="bg-amber-950 text-amber-200 px-4 py-2 text-xs flex items-center gap-2 flex-wrap">
                                <span>Metin ve ayarların bir kısmı yalnızca bu oturumda tutuluyor. Sayfayı kapatmadan proje yedeği alın.</span>
                                <Btn tone="g" onClick={exportProject}>Güncel yedeği indir</Btn>
                                <Btn tone="g" onClick={() => { if (window.__afRetryStorage?.()) notify('Metin ve ayarlar kalıcı kayda aktarıldı.'); else notify('Tarayıcı kaydı hâlâ kullanılamıyor.', 'error'); }}>Kaydı yeniden dene</Btn>
                            </div>
                        )}
                        {storageWriteLocked && (
                            <div role="alert" className="bg-amber-950 text-amber-200 px-4 py-2 text-xs">
                                Başka sekmeyle kayıt çakışması: otomatik yazma durduruldu. Mevcut çalışmayı Ayarlar → Proje dosyasını indir ile yedekleyin ve sayfayı yeniden yükleyin.
                            </div>
                        )}
                        {editSession && <div role="status" className="border-y border-violet-500/30 bg-violet-950/60 px-4 py-2 flex items-center gap-2 flex-wrap text-xs"><b>Açık Image Lab düzenlemesi: {A(editSession.sourceId)?.name || 'Kaynak kare'}</b><Btn tone="g" onClick={()=>setTab('lab')}>Düzenlemeye dön</Btn><Btn tone="a" disabled={!A(editSession.draftId)||busy('lab.run')} onClick={()=>commitEdit(A(editSession.draftId))}>Uygula ve geri dön</Btn><Btn tone="r" disabled={busy('lab.run')} onClick={cancelEdit}>Vazgeç</Btn><span className="text-slate-400">Onaylanmamış taslak yenilemede kaybolur.</span></div>}
                        <JobBar S={S} />
                        <PerformancePanel S={S} />
                    </div>

                    <main className="af-v234-main flex-1 w-full max-w-[1900px] mx-auto px-3 py-3 pb-8">
                        {TABS.map(([id]) => { const V = VIEW[id]; return <div key={`${id}-${epoch}`} className={tab === id ? 'fx-fade' : 'hidden'}><V S={S} active={tab===id} /></div>; })}
                    </main>
                    {globalLibraryOpen && <LibraryPicker S={S} onClose={() => setGlobalLibraryOpen(false)} onPick={(id) => { const a = A(id); if (a) loadHere(a); }} />}
                    {insp && <Inspector items={insp.items} start={insp.start} onClose={() => setInsp(null)} S={S} />}
                    {castOpen && <CastManager S={S} />}
                    {settingsOpen && <SettingsModal S={S} />}
                    {resetModalOpen && <ResetModal S={S} onClose={() => setResetModalOpen(false)} />}
                    {note && (
                        <div role="status" aria-live="polite" className={`fixed bottom-6 left-1/2 -translate-x-1/2 z-[80] px-4 py-2 rounded-xl text-[12px] font-semibold shadow-2xl fx-pop flex items-center gap-3 ${note.type === 'error' ? 'bg-rose-600 text-white' : 'bg-emerald-600 text-white'}`}>
                            <span>{note.message}</span>{note.action && <button className="underline font-bold" onClick={note.action.fn}>{note.action.label}</button>}
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
